<style>
:root{--bg:#f4f6fb;--card:#fff;--txt:#1e293b;--mut:#64748b;--line:#e2e8f0;--pri:#4f46e5;--pri2:#7c3aed;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--u1:#e11d74;--u2:#0891b2;--sh:0 4px 18px rgba(15,23,42,.08)}
body.dark{--bg:#0f172a;--card:#1e293b;--txt:#e2e8f0;--mut:#94a3b8;--line:#334155;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.75;min-height:100vh;padding-bottom:76px}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(79,70,229,.35)}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:19px;display:flex;align-items:center;justify-content:center}
.wrap{max-width:820px;margin:0 auto;padding:14px}
.trial{background:linear-gradient(90deg,#fef3c7,#fde68a);color:#78350f;border-radius:14px;padding:10px 14px;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.trial b{font-size:16px}
.trial.ok{background:linear-gradient(90deg,#dcfce7,#bbf7d0);color:#14532d}
.hero{background:linear-gradient(135deg,#312e81,#6d28d9 60%,#db2777);color:#fff;border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero h2{margin:0 0 4px;font-size:24px}
.hero p{margin:0;opacity:.9;font-size:14px}
.hero .atom{position:absolute;left:-10px;top:-10px;font-size:110px;opacity:.15}
.hero .prog{margin-top:14px;background:rgba(255,255,255,.2);border-radius:20px;height:10px;overflow:hidden}
.hero .prog i{display:block;height:100%;background:#fde047;border-radius:20px;transition:width .6s}
.hero small{display:block;margin-top:6px;font-size:13px;opacity:.9}
.bookbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;border:0;border-radius:18px;padding:14px 16px;background:linear-gradient(135deg,#f97316,#ef4444);color:#fff;font-size:17px;font-weight:700;box-shadow:0 6px 18px rgba(239,68,68,.35)}
.bookbtn span.i{font-size:28px}
.bookbtn small{display:block;font-weight:400;font-size:12px;opacity:.9}
.sec{font-size:17px;font-weight:800;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid.g3{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh);border:1px solid var(--line);text-align:right;color:var(--txt);display:flex;flex-direction:column;gap:4px;min-height:96px;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:28px}
.tile b{font-size:15px}
.tile small{color:var(--mut);font-size:12px;line-height:1.5}
.unit{background:var(--card);border-radius:20px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:14px;overflow:hidden}
.unit .uh{padding:14px 16px;color:#fff;display:flex;gap:12px;align-items:center}
.unit .uh .n{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.unit .uh h3{margin:0;font-size:17px}
.unit .uh small{opacity:.9;font-size:12px}
.les{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:right;color:var(--txt);font-size:15px}
.les .num{min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.les .t{flex:1}
.les .t small{display:block;color:var(--mut);font-size:12px}
.badge{font-size:12px;padding:2px 9px;border-radius:20px;background:var(--bg);color:var(--mut);white-space:nowrap}
.badge.g{background:#dcfce7;color:#15803d}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;position:sticky;top:64px;z-index:10;background:var(--bg)}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:30px;padding:8px 14px;font-size:14px;font-weight:600}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);border:1px solid var(--line);margin-bottom:12px}
.card h3{color:var(--pri);font-size:17px;margin:18px 0 8px}
.card h3:first-child{margin-top:0}
body.dark .card h3{color:#a5b4fc}
.card p{margin:6px 0}
.card ul,.card ol{padding-right:20px;margin:6px 0}
.card li{margin:4px 0}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px;display:block;overflow-x:auto}
table tbody{display:table;width:100%}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:center}
th{background:var(--pri);color:#fff;font-weight:700}
tr:nth-child(even) td{background:rgba(99,102,241,.05)}
.box{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:15px}
.box.key{background:#eef2ff;border-right:5px solid var(--pri)}
.box.ex{background:#ecfeff;border-right:5px solid var(--u2)}
body.dark .box.key{background:#1e1b4b}
body.dark .box.ex{background:#083344}
.eq{direction:ltr;text-align:center;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px;margin:8px 0;font-weight:700;font-size:15px;unicode-bidi:plaintext}
.series{text-align:center;direction:ltr;background:linear-gradient(90deg,#fee2e2,#e0e7ff);border-radius:12px;padding:10px;font-weight:800;margin:8px 0;color:#1e293b}
.series small{direction:rtl;display:block;font-weight:400}
.note{color:var(--mut);font-size:14px;background:var(--bg);padding:8px 12px;border-radius:10px}
.idea{background:linear-gradient(135deg,#fdf4ff,#eef2ff);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #e9d5ff}
body.dark .idea{background:linear-gradient(135deg,#3b0764,#1e1b4b);border-color:#581c87}
.idea b{color:#7e22ce}
body.dark .idea b{color:#e9d5ff}
.term{border-right:4px solid var(--pri2);padding:10px 12px;background:var(--card);border-radius:12px;margin-bottom:10px;box-shadow:var(--sh)}
.term b{font-size:16px}
.term i{color:var(--mut);font-size:13px;font-style:normal;direction:ltr;display:inline-block;margin-right:6px}
.qa{background:var(--card);border-radius:16px;margin-bottom:10px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.qa .q{padding:12px 14px;font-weight:700;display:flex;gap:10px}
.qa .q .n{min-width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.qa .sh{margin:0 14px 12px;border:0;background:var(--bg);color:var(--pri);border-radius:10px;padding:6px 14px;font-weight:700;font-size:14px}
.qa .a{display:none;padding:12px 14px;background:#f0fdf4;border-top:1px solid #bbf7d0;font-size:15px}
body.dark .qa .a{background:#052e16;border-color:#14532d}
.qa.open .a{display:block}
.qz .qtxt{font-size:17px;font-weight:700;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:right;border:2px solid var(--line);background:var(--card);color:var(--txt);border-radius:14px;padding:12px 14px;margin-bottom:9px;font-size:16px;transition:.15s}
.opt.c{border-color:var(--ok);background:#dcfce7;color:#14532d}
.opt.w{border-color:var(--bad);background:#fee2e2;color:#7f1d1d}
.expl{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:10px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .3s}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.btn.sec2{background:var(--card);color:var(--pri);border:2px solid var(--pri);box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#22c55e,#15803d)}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.score{text-align:center;padding:20px}
.score .big{font-size:52px;font-weight:800;background:linear-gradient(135deg,var(--pri),#db2777);-webkit-background-clip:text;background-clip:text;color:transparent}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.fld input,.fld select{width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--txt);direction:ltr;text-align:left}
.fld select{direction:rtl;text-align:right}
.res{background:linear-gradient(135deg,#eef2ff,#fdf4ff);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:15px;line-height:1.9}
body.dark .res{background:linear-gradient(135deg,#1e1b4b,#3b0764)}
.res b{color:var(--pri)}
body.dark .res b{color:#c4b5fd}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:20px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.nav button{border:0;background:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 8px;border-radius:12px;min-width:58px}
.nav button span{font-size:21px}
.nav button.on{color:var(--pri);background:rgba(79,70,229,.08)}
.ptgrid{display:grid;grid-template-columns:repeat(18,minmax(34px,1fr));gap:3px;min-width:700px;direction:ltr}
.ptw{overflow-x:auto;padding-bottom:8px}
.el{border:0;border-radius:6px;padding:3px 1px;font-size:10px;line-height:1.2;color:#1e293b;text-align:center;min-height:40px}
.el b{display:block;font-size:14px}
.el.an{background:#fca5a5}.el.ae{background:#fdba74}.el.tm{background:#fde68a}.el.pt{background:#a7f3d0}.el.md{background:#99f6e4}.el.nm{background:#93c5fd}.el.hl{background:#c4b5fd}.el.ng{background:#f0abfc}.el.la{background:#fbcfe8}.el.ac{background:#e9d5ff}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin:8px 0}
.legend span{padding:2px 8px;border-radius:8px;color:#1e293b}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{max-width:420px;width:100%;animation:pop .2s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.flash{perspective:1000px;height:240px;margin-bottom:14px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.f .in{transform:rotateY(180deg)}
.flash .fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:var(--sh)}
.flash .fr{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:22px;font-weight:800}
.flash .bk{background:var(--card);transform:rotateY(180deg);font-size:16px;border:2px solid var(--pri)}
.lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#312e81,#6d28d9,#db2777)}
.lock .card{max-width:430px;width:100%;text-align:center}
.code{font-size:26px;font-weight:800;letter-spacing:3px;direction:ltr;background:var(--bg);border-radius:12px;padding:10px;margin:8px 0;font-family:monospace}
.credit{text-align:center;color:var(--mut);font-size:13px;margin:22px 0 6px}
.credit b{color:var(--pri)}
.svgbox{background:var(--bg);border-radius:16px;display:flex;justify-content:center;margin:10px 0}
.timer{font-weight:800;font-size:18px;direction:ltr}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;z-index:80;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.fab{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.lnk{border:0;border-radius:12px;padding:9px 14px;color:#fff;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}

const UNITS = [

 content:`
<h3>1) أزواج إلكترونات مستوى التكافؤ</h3>
<p>تتوزع الإلكترونات في الذرة على مستويات الطاقة، ويسمى المستوى الخارجي <b>مستوى التكافؤ (Valence Shell)</b>، وتسمى إلكتروناته <b>إلكترونات التكافؤ</b>، وهي التي تحدد نوع الرابطة التي تكوّنها الذرة عند تفاعلها.</p>
<h3>2) الروابط التساهمية</h3>
<p>عند ارتباط ذرتين من اللافلزات تتشاركان بزوج أو أكثر من الإلكترونات، تنجذب نحو نواتي الذرتين معًا، وتسمى قوة الجذب الناشئة <b>الرابطة التساهمية</b>.</p>
<div class="box ex"><b>مثال - الميثان CH₄:</b> تمتلك ذرة الكربون 4 إلكترونات تكافؤ، وتشارك كل ذرة هيدروجين بزوج إلكترونات، فيحيط بالكربون <b>4 أزواج رابطة</b> وتنشأ 4 روابط أحادية.</div>
<ul>
<li><b>أزواج الإلكترونات الرابطة:</b> إلكترونات مستوى التكافؤ التي شاركت في تكوين الروابط.</li>
<li><b>الذرة المركزية:</b> الذرة الأقل عددًا في الجزيء المكوَّن من أكثر من ذرتين، وتكوِّن أكبر عدد من الروابط.</li>
<li><b>أزواج الإلكترونات غير الرابطة:</b> أزواج من الإلكترونات تظهر في مستوى التكافؤ للذرة المركزية لا تشارك في تكوين الروابط.</li>
</ul>
<div class="box ex"><b>مثال - الأمونيا NH₃:</b> للنيتروجين 5 إلكترونات تكافؤ؛ يشارك بثلاثة أزواج رابطة مع 3 ذرات هيدروجين، ويبقى <b>زوج واحد غير رابط</b>.</div>
<h3>3) قاعدة الثمانية واستثناءاتها</h3>
<p>معظم الذرات في الجزيئات تحقق <b>قاعدة الثمانية</b> (8 إلكترونات في مستوى التكافؤ) فيصبح تركيبها مشابهًا لأقرب غاز نبيل، مثل: HCl, H₂O, Cl₂, C₂H₆, CO₂, C₂H₄, O₂, N₂, C₂H₂.</p>

<h3>4) الرابطة التناسقية (Coordinate Bond)</h3>
<p>نوع من الروابط التساهمية ينشأ نتيجة مشاركة إحدى الذرتين <b>بزوج من الإلكترونات غير الرابطة</b>، في حين تشارك الذرة الأخرى <b>بفلك فارغ</b>. ويُرمز لها بسهم يشير إلى الذرة المشاركة بالفلك الفارغ.</p>
<div class="eq">NH₃ + H⁺ → NH₄⁺ &nbsp;&nbsp;&nbsp; | &nbsp;&nbsp;&nbsp; BF₃ + F⁻ → BF₄⁻</div>
<p>في NH₄⁺: يشارك N بزوجه غير الرابط مع الفلك الفارغ لأيون H⁺. وفي BF₄⁻: تمتلك ذرة البورون فلكًا فارغًا يستقبل زوجًا غير رابط من أيون F⁻. ومن الأمثلة أيضًا: H₃O⁺ و BeCl₄²⁻.</p>
<h3>5) نظرية تنافر أزواج إلكترونات مستوى التكافؤ (VSEPR)</h3>
<p>تفترض أن أزواج إلكترونات التكافؤ تترتب حول الذرة المركزية بحيث تكون <b>أبعد ما يمكن</b> ليكون التنافر بينها <b>أقل ما يمكن</b>؛ فيتخذ الجزيء شكلًا فراغيًا أكثر ثباتًا واستقرارًا، ويمكن بها التنبؤ بالزوايا وبالشكل.</p>

 content:`
<p>فسّرت نظرية VSEPR أشكال الجزيئات، لكنها لم توضح كيفية توزع الإلكترونات في الأفلاك. لذلك وُضعت نظريتان: <b>نظرية رابطة التكافؤ</b> و<b>نظرية الأفلاك الجزيئية</b>، وندرس هنا الأولى.</p>
<h3>1) نظرية رابطة التكافؤ (Valence Bond Theory)</h3>
<p>عند تكوين رابطة بين ذرتين <b>يتداخل فلك تكافؤ</b> إحداهما (نصف ممتلئ) مع فلك تكافؤ الأخرى، ويتحرك الإلكترونان في منطقة التداخل وينجذبان لنواتيهما. تسمى هذه المنطقة <b>الكثافة الإلكترونية</b>: منطقة التداخل بين الذرتين التي يتركز فيها وجود إلكترونات الرابطة، ولا تتسع لأكثر من إلكترونين.</p>
<h3>2) الرابطة سيجما (σ) والرابطة باي (π)</h3>
<table><tr><th>وجه المقارنة</th><th>سيجما σ</th><th>باي π</th></tr>
<tr><td>نوع التداخل</td><td>رأسي (رأسًا لرأس) على امتداد المحور الواصل بين النواتين</td><td>جانبي بين فلكي p متوازيين</td></tr>
<tr><td>موقع الكثافة الإلكترونية</td><td>على المحور بين النواتين</td><td>على جانبي المحور (فوقه وتحته)</td></tr>
<tr><td>الأفلاك</td><td>s–s ، s–p ، p–p ، مهجن–مهجن ، مهجن–s</td><td>p–p فقط</td></tr></table>
<ul>
<li><b>H₂:</b> تداخل 1s–1s ← رابطة σ.</li>
<li><b>HCl:</b> تداخل 1s (H) مع 3p (Cl) ← رابطة σ.</li>
<li><b>Cl₂:</b> [Ne]3s²3p⁵؛ يتداخل الفلكان 3p نصف الممتلئين رأسًا لرأس ← σ.</li>
<li><b>O₂ (رابطة ثنائية):</b> 2s²2p⁴؛ إلكترونان منفردان: تداخل رأسي ← σ، وتداخل جانبي ← π. إذن: <b>1σ + 1π</b>.</li>
<li><b>N₂ (رابطة ثلاثية):</b> 2s²2p³؛ ثلاثة إلكترونات منفردة: <b>1σ + 2π</b>.</li></ul>
<div class="box key">قاعدة سريعة: الرابطة الأحادية = σ ، الثنائية = σ + π ، الثلاثية = σ + 2π.</div>
<h3>3) التهجين والأفلاك المهجنة</h3>
<p>لا تتوافق بعض الجزيئات مع ما سبق؛ فالكربون (2s²2p²) يحتوي إلكترونين منفردين فقط ويُتوقع أن يكوّن رابطتين بزاوية 90°، لكنه في CH₄ يكوّن <b>4 روابط</b> متماثلة بزاوية 109.5°. التفسير: <b>التهجين</b>.</p>
<p><b>التهجين (Hybridization):</b> اندماج أفلاك مستوى التكافؤ في الذرة نفسها لينتج منها أفلاك جديدة متماثلة في الشكل والطاقة، تختلف عن الأفلاك الذرية في الشكل والطاقة والاتجاه، وتسمى <b>الأفلاك المهجنة</b>.</p>
<p>يعتمد نوع التهجين على عدد أزواج الإلكترونات المحيطة بالذرة المركزية (عدد المجموعات).</p>
<table><tr><th>التهجين</th><th>الأفلاك المندمجة</th><th>عدد الأفلاك المهجنة</th><th>الزاوية</th><th>أمثلة</th></tr>
<tr><td>sp</td><td>s + p</td><td>2</td><td>180°</td><td>BeH₂, BeCl₂</td></tr>
<tr><td>sp²</td><td>s + 2p</td><td>3</td><td>120°</td><td>BF₃, BH₃</td></tr>
<tr><td>sp³</td><td>s + 3p</td><td>4</td><td>109.5°</td><td>CH₄, NH₃, H₂O, SiCl₄</td></tr></table>
<ul>
<li><b>CH₄:</b> يندمج 2s مع ثلاثة 2p ← أربعة أفلاك sp³ نصف ممتلئة، يتداخل كل منها مع 1s للهيدروجين ← 4 روابط σ (s–sp³).</li>
<li><b>H₂O:</b> الزاوية الحقيقية 104.5° أقرب إلى 109.5° منها إلى 90° ← الأكسجين يستخدم أفلاك <b>sp³</b>؛ اثنان رابطان واثنان فيهما أزواج غير رابطة.</li>
<li><b>NH₃:</b> الزاوية 107° قريبة من 109.5° ← تهجين <b>sp³</b>.</li>
<li><b>BF₃:</b> البورون 2s²2p¹: يندمج 2s مع فلكين 2p ← 3 أفلاك sp² ← مثلث مستوٍ 120°.</li>
<li><b>BeH₂:</b> البيريليوم 1s²2s² بلا إلكترونات منفردة؛ يُثار إلكترون ثم يندمج 2s مع 2p ← فلكان sp ← خطي 180°.</li></ul>
<h3>4) قطبية الجزيئات</h3>
<p>تعتمد <b>قطبية الرابطة</b> على الفرق في السالبية الكهربائية بين الذرتين؛ تزداد بزيادته. في HCl تُزاح الكثافة نحو Cl فتظهر عليه شحنة جزئية سالبة δ⁻ وعلى H شحنة δ⁺ ← رابطة قطبية. أما Cl₂ فرابطته غير قطبية.</p>
<p><b>العزم القطبي (Dipole Moment):</b> مقياس كمّي لمدى توزّع الشحنات في الجزيء، ويقاس بوحدة <b>الديباي (D)</b>.</p>
<p>يتوقف وجود العزم القطبي على <b>قطبية الروابط</b> و<b>الشكل الفراغي</b> معًا؛ فالروابط كمتجهات قد يلغي بعضها بعضًا:</p>
<ul><li><b>BeCl₂</b> خطي: قطبيتا الرابطتين متساويتان ومتعاكستان ← المحصلة صفر ← <b>غير قطبي</b>.</li>
<li><b>H₂O</b> منحنٍ: لا تلغي الروابط بعضها ← <b>قطبي</b>.</li></ul>

{id:'u1l3', unit:1, n:3, title:'القوى بين الجزيئات', en:'Intermolecular Forces', pages:'30 - 38',
 idea:'ترتبط الجزيئات في المواد المختلفة وذرات الغازات النبيلة بقوى تجاذب ذات أهمية كبيرة في تحديد خصائصها الفيزيائية.',
 goals:['أتوصل إلى المفاهيم الأساسية المتعلقة بالقوى بين الجزيئات.','أتعرف أنواع قوى التجاذب بين الجزيئات.','أستكشف أثر قوى التجاذب في الخصائص الفيزيائية للمواد.'],
 content:`
<p><b>القوى بين الجزيئات (Intermolecular Forces):</b> قوى تجاذب تنشأ بين جسيمات المادة نفسها، تختلف بطبيعتها عن الروابط الكيميائية بين الذرات، وتكون <b>أضعف منها بكثير</b> (تعادل 1–10% من قوة الرابطة التساهمية). وهي المسؤولة عن درجتي الغليان والانصهار، واللزوجة، وتحولات الحالة.</p>
<p>ضعيفة جدًا في الغازات (فتنتشر وتتدفق بسهولة)، أقوى في السوائل (فيثبت حجمها)، وأقوى في المواد الصلبة (فيثبت حجمها وشكلها).</p>
<h3>1) الروابط الهيدروجينية (Hydrogen Bonds)</h3>
<p>تنشأ بين الجزيئات التي تحتوي ذرة <b>هيدروجين مرتبطة تساهميًا بذرة عالية السالبية الكهربائية: F أو O أو N</b>، مثل HF, H₂O, NH₃.</p>
<p>تُزاح الكثافة نحو الذرة عالية السالبية (δ⁻) وتصبح H ذات شحنة δ⁺، فتنجذب H في جزيء نحو زوج إلكترونات غير رابط على F أو O أو N في جزيء مجاور.</p>
<ul><li>تعتمد قوتها على <b>قطبية الرابطة</b>: H–F &gt; H–O &gt; H–N؛ لذا الرابطة الهيدروجينية في HF الأقوى.</li>
<li>يكوّن جزيء الماء روابط هيدروجينية أكثر (زوجان غير رابطين + ذرتا H) فتنشأ شبكة؛ لذلك <b>درجة غليان الماء أعلى من HF</b> رغم أن الرابطة الهيدروجينية في HF أقوى.</li>
<li>تنشأ أيضًا بين جزيئات مختلفة، مثل الميثانول CH₃OH مع الماء.</li>
<li>تُعدّ طاقة الرابطة مقياسًا لقوتها.</li></ul>
<h3>2) القوى ثنائية القطب (Dipole-Dipole Forces)</h3>
<p>قوى تنشأ بين <b>الجزيئات القطبية</b> نتيجة تجاذب الطرف الموجب (δ⁺) لجزيء مع الطرف السالب (δ⁻) لجزيء مجاور، مثل HCl, CHCl₃, BF₂Cl. وتزداد بزيادة العزم القطبي. وتُعدّ <b>الرابطة الهيدروجينية حالة خاصة</b> من القوى ثنائية القطب.</p>
<p>المواد التي ترتبط جزيئاتها بروابط هيدروجينية لها عمومًا درجات غليان أعلى من التي ترتبط بقوى ثنائية القطب؛ فالرابطة الهيدروجينية أقوى.</p>

<h3>3) قوى لندن (London Forces)</h3>
<p>قوى تجاذب ضعيفة تنشأ نتيجة <b>الاستقطاب اللحظي</b> للجزيئات أو الذرات. بسبب حركة الإلكترونات المستمرة قد يزداد عددها في طرف من الجزيء في لحظة ما فيصبح قطبيًا لحظيًا، ويحث ذلك الجزيئات المجاورة على الاستقطاب.</p>
<ul><li>تنشأ بين <b>جميع</b> الجزيئات والذرات، لكنها أوضح بين الجزيئات غير القطبية وذرات الغازات النبيلة (لعدم وجود قوى أخرى).</li>
<li>من أضعف أنواع قوى التجاذب.</li>
<li>تزداد بزيادة <b>عدد الإلكترونات أو الكتلة المولية</b>.</li></ul>
<div class="box key"><b>ترتيب القوة عمومًا:</b> الرابطة الهيدروجينية &gt; ثنائية القطب &gt; لندن (عند تقارب الكتل المولية).<br>تزداد درجة الغليان والانصهار وطاقة التبخر كلما كانت القوى أقوى.</div>
<h3>4) درجات غليان مركبات الهيدروجين (4A–7A)</h3>
<p>تزداد درجات الغليان بزيادة الكتلة المولية (زيادة قوى لندن)، لكن <b>H₂O و HF و NH₃</b> شاذة بدرجات غليان أعلى بكثير رغم كتلتها الأقل، بسبب الروابط الهيدروجينية (باستثناء SbH₃ التي غليانها أعلى من NH₃ لكبر كتلتها). أما مركبات المجموعة 4A (CH₄ &lt; SiH₄ &lt; GeH₄ &lt; SnH₄) فتزداد بانتظام لأن قواها لندن فقط.</p>
<h3>الربط بالحياة</h3>
<p><b>الصابون</b> (RCOO⁻Na⁺): الطرف الأيوني يتجاذب مع الماء، والطرف الهيدروكربوني غير القطبي R ينغمس في الأوساخ ويتجاذب معها بقوى لندن، فيضعف تجاذب الأوساخ ويشتتها ويسحبها مع الماء.<br><b>شاشات LCD:</b> تعتمد البلّورات السائلة على قوى ثنائية القطب ضعيفة نسبيًا بين جزيئاتها.</p>`,

{id:'u2l1', unit:2, n:1, title:'التفاعلات الكيميائية', en:'Chemical Reactions', pages:'46 - 62',
 idea:'تعتمد أنواع التفاعلات الكيميائية على التغيرات التي تحدث للمواد المتفاعلة والناتجة، ويمكن التعبير عن التفاعلات التي تحدث في المحاليل المائية بمعادلات أيونية.',
 goals:['أصنف التفاعلات الكيميائية إلى أنواعها وأذكر أمثلة عليها.','أكتب معادلات أيونية موزونة لتفاعلات التعادل والترسيب والتفاعلات التي يصاحبها إطلاق غاز.'],
 content:`
<h3>1) تفاعلات الاتحاد (Combination) — A + B → AB</h3>
<p>تفاعل تتحد فيه مادتان أو أكثر (عناصر أو مركبات) لإنتاج مادة جديدة واحدة تختلف في خصائصها، ويسمى أيضًا تفاعل التكوين أو التحضير.</p>
<table><tr><th>النوع</th><th>أمثلة</th></tr>
<tr><td>عنصر مع عنصر</td><td>2Na(s) + Cl₂(g) → 2NaCl(s)<br>Fe(s) + S(s) → FeS(s)<br>2Mg(s) + O₂(g) → 2MgO(s) (ضوء أبيض ساطع)</td></tr>
<tr><td>عنصر مع مركب</td><td>2CO(g) + O₂(g) → 2CO₂(g)<br>2H₂SO₃(aq) + O₂(g) → 2H₂SO₄(aq)</td></tr>
<tr><td>مركب مع مركب</td><td>SO₂(g) + CaO(s) → CaSO₃(s)<br>CaO(s) + H₂O(l) → Ca(OH)₂(aq) (الجير المطفأ)</td></tr></table>
<h3>2) تفاعلات التحلل (Decomposition) — AB → A + B</h3>
<p>تفاعل يتحلل فيه مركب واحد بوجود طاقة حرارية أو ضوئية أو كهربائية إلى مادتين أو أكثر، وهو عكس الاتحاد.</p>
<table><tr><th>النوع</th><th>أمثلة</th></tr>
<tr><td>مركب ← عنصرين</td><td>2H₂O(l) → 2H₂(g) + O₂(g) (تحليل كهربائي، نسبة H₂:O₂ = 2:1)<br>2AgBr(s) → 2Ag(s) + Br₂(l) (ضوء)<br>2HgO(s) → 2Hg(l) + O₂(g) (حرارة)</td></tr>
<tr><td>مركب ← مركبين أو أكثر</td><td>2NaHCO₃(s) → Na₂CO₃(s) + CO₂(g) + H₂O(g)<br>Ca(OH)₂(s) → CaO(s) + H₂O(g)</td></tr>
<tr><td>مركب ← عناصر ومركبات</td><td>2KClO₃(s) → 2KCl(s) + 3O₂(g) (حرارة + MnO₂)<br>(NH₄)₂Cr₂O₇(s) → Cr₂O₃(s) + 4H₂O(g) + N₂(g)</td></tr></table>
<p class="note">كربونات الفلزات الهيدروجينية ← كربونات الفلز + H₂O + CO₂ | هيدروكسيدات الفلزات ← أكسيد الفلز + H₂O | كلورات الفلزات ← كلوريد الفلز + O₂</p>
<h3>3) تفاعلات الإحلال الأحادي (Single Displacement) — A + BC → AC + B</h3>
<p>تفاعل يحل فيه عنصر محل عنصر آخر في أحد مركباته أو محلول أحد أملاحه (ويسمى الاستبدال أو الإحلال البسيط). يعتمد على <b>سلسلة النشاط الكيميائي</b>: العنصر الأكثر نشاطًا يحل محل الأقل نشاطًا، ولا يحدث العكس.</p>
<div class="series">Na &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Ni &gt; Pb &gt; Cu &gt; Ag<br><small>الأكثر نشاطًا ← الأقل نشاطًا</small></div>
<ul><li><b>فلز محل فلز:</b> Cu(s) + 2AgNO₃(aq) → Cu(NO₃)₂(aq) + 2Ag(s)<br>2Al(s) + 3Pb(NO₃)₂(aq) → 3Pb(s) + 2Al(NO₃)₃(aq)<br>Mg(s) + NiSO₄(aq) → MgSO₄(aq) + Ni(s) ، أما Ni + MgSO₄ ← لا يحدث تفاعل.</li>
<li><b>فلز محل الهيدروجين في الماء أو الحمض:</b> 2Na(s) + 2H₂O(l) → 2NaOH(aq) + H₂(g)<br>Mg(s) + 2HCl(aq) → MgCl₂(aq) + H₂(g)</li>
<li><b>لافلز محل لافلز (الهالوجينات):</b> F₂ &gt; Cl₂ &gt; Br₂ &gt; I₂<br>Cl₂(g) + 2NaBr(aq) → 2NaCl(aq) + Br₂(l) ، أما Br₂ + NaCl ← لا يحدث تفاعل.</li></ul>
<div class="box ex"><b>تفاعل الثيرمايت:</b> 2Al + Fe₂O₃ → 2Fe + Al₂O₃ + حرارة — حرارة عالية تصهر الحديد ويُستخدم في لحام قضبان السكك الحديدية.</div>
<h3>4) تفاعلات الإحلال المزدوج (Double Displacement) — AB + CD → AD + CB</h3>
<p>يحل كل من عنصرين محل الآخر في مركباتهما أو محاليلهما المائية (تبادل موقعي الأيونين الموجبين). أنواعه:</p>
<ul><li><b>تفاعل الترسيب:</b> تظهر فيه مادة راسبة نتيجة خلط محلولين لملحين ذائبين.<br>Na₂CO₃(aq) + CuSO₄(aq) → Na₂SO₄(aq) + CuCO₃(s)<br>KCl(aq) + AgNO₃(aq) → AgCl(s) + KNO₃(aq)</li>
<li><b>تفاعل يصاحبه انطلاق غاز:</b><br>CaCO₃(s) + 2HCl(aq) → CaCl₂(aq) + H₂O(l) + CO₂(g) (يتكون H₂CO₃ ثم يتفكك)<br>FeS(s) + 2HCl(aq) → FeCl₂(aq) + H₂S(g)</li>
<li><b>تفاعل التعادل:</b> تفاعل حمض مع قاعدة لإنتاج الملح والماء (تتعادل H⁺ مع OH⁻).<br>HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O(l)<br>H₂SO₄(aq) + 2LiOH(aq) → Li₂SO₄(aq) + 2H₂O(l)</li></ul>
<p class="note">الربط بالطب: أقراص مضادات الحموضة تحتوي قاعدة مثل Mg(OH)₂ تعادل حمض HCl الزائد في المعدة.</p>
<h3>5) المعادلة الأيونية (Ionic Equation)</h3>
<p>المعادلة الكيميائية لا تُظهر الأيونات في المحاليل؛ لذا تُكتب <b>المعادلة الأيونية</b> التي تظهر فيها جميع الجسيمات في المحلول (المواد الذائبة aq تُكتب أيونات، أما الصلبة s والسائلة l والغازية g فتبقى كما هي).</p>
<div class="eq">Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)</div>
<div class="eq">Pb²⁺ + 2NO₃⁻ + 2K⁺ + 2I⁻ → PbI₂(s) + 2K⁺ + 2NO₃⁻</div>
<p><b>الأيونات المتفرجة:</b> الأيونات التي لم تتغير في طرفي المعادلة ولم تشترك في التفاعل (هنا K⁺ و NO₃⁻) وتُحذف.</p>
<p><b>المعادلة الأيونية النهائية (الصافية):</b> تظهر فيها الأيونات المتفاعلة فقط:</p>
<div class="eq">Pb²⁺(aq) + 2I⁻(aq) → PbI₂(s) &nbsp; (راسب أصفر)</div>
<div class="box key">المعادلة الأيونية النهائية الموزونة تحقق قانوني <b>حفظ الكتلة</b> (نوع الذرات وعددها) و<b>حفظ الشحنة</b>: (1×+2) + (2×-1) = 0 = شحنة PbI₂.</div>
<h3>خطوات كتابة المعادلة الأيونية النهائية</h3>
<ol><li>اكتب المعادلة الموزونة مع الحالات الفيزيائية.</li><li>فكّك المواد (aq) إلى أيوناتها مع مراعاة المعاملات.</li><li>احذف الأيونات المتفرجة من الطرفين.</li><li>اكتب ما تبقى وتحقق من حفظ الكتلة والشحنة.</li></ol>`,
 terms:[
  ['تفاعل الاتحاد','Combination Reaction','تفاعل كيميائي تتحد فيه مادتان أو أكثر لإنتاج مادة جديدة واحدة.'],
  ['تفاعل التحلل','Decomposition Reaction','تفاعل يتحلل فيه مركب واحد بوجود طاقة حرارية أو ضوئية أو كهربائية لإنتاج مادتين أو أكثر.'],

{id:'u2l2', unit:2, n:2, title:'تركيز المحاليل', en:'Concentration of Solutions', pages:'63 - 74',
 idea:'يمكن التعبير عن تركيز المحلول بالنسبة المئوية والمولارية والمولالية.',
 goals:['أحسب تركيز المحلول باستخدام المولارية والمولالية والنسبة المئوية.','أحضّر مخبريًا محاليل قياسية بتراكيز مختلفة.'],
 content:`
<p><b>تركيز المحلول:</b> مقياس لكمية المادة المذابة في كمية محددة من المذيب أو المحلول.</p>
<ul><li><b>المحلول المركز:</b> يحتوي كمية كبيرة من المادة المذابة في حجم معين من المذيب.</li>
<li><b>المحلول المخفف:</b> يحتوي كمية قليلة من المذاب في حجم معين من المذيب.</li></ul>
<h3>1) النسبة المئوية بالكتلة (m%)</h3>
<p>النسبة المئوية بين كتلة المذاب إلى كتلة المحلول (كتلة المحلول = كتلة المذاب + كتلة المذيب). تُستخدم عندما يكون المذاب صلبًا والمذيب سائلًا.</p>
<div class="eq">m% = (كتلة المذاب ÷ كتلة المحلول) × 100%</div>
<p>محلول 8% من ملح الطعام: 8 g ملح + 92 g ماء = 100 g محلول. والمحلول الملحي الفسيولوجي 0.9% بالكتلة (0.9 g NaCl في 100 g محلول) لتعويض السوائل.</p>
<h3>2) النسبة المئوية بالحجم (V%)</h3>
<p>النسبة المئوية بين حجم المذاب إلى حجم المحلول. تُستخدم عندما يكون المذاب والمذيب سائلين.</p>
<div class="eq">V% = (حجم المذاب ÷ حجم المحلول) × 100%</div>
<p>حمض كبريتيك 98%: كل 100 mL محلول تحتوي 98 mL حمض و 2 mL ماء. الديزل الحيوي الممزوج: 20% حيوي و 80% نفطي بالحجم.</p>
<h3>3) المولارية (M)</h3>
<p>عدد مولات المادة المذابة في لتر واحد من المحلول، ووحدتها mol/L أو M.</p>
<div class="eq">M = n (mol) ÷ V (L) &nbsp;&nbsp;&nbsp; ، &nbsp;&nbsp;&nbsp; n = m ÷ Mr</div>
<h3>4) المولالية (m)</h3>
<p>نسبة عدد مولات المذاب في 1 kg من المذيب، ووحدتها mol/kg.</p>
<div class="eq">m = n (mol) ÷ كتلة المذيب (kg)</div>
<div class="box key"><b>لماذا المولالية أدق من المولارية؟</b> لأن حجم المحلول يتأثر بدرجة الحرارة (يزداد بالتسخين فيقل التركيز المولاري)، أما الكتل وعدد المولات فلا تتغير، والمولالية تعتمد على الكتلة.</div>
<h3>5) المحاليل القياسية</h3>
<p>محاليل معلومة التركيز بدقة، تُحضّر بإذابة كتلة معينة من المادة النقية في كمية محددة من المذيب باستخدام <b>الدورق الحجمي</b>. مثال: محلول NaOH تركيزه 0.1 M يمكن تحضيره بإذابة 4 g في 1 L، أو 0.4 g في 100 mL، أو 0.04 g في 10 mL.</p>
<h3>6) تخفيف المحاليل</h3>
<p>بإضافة كمية من المذيب يزداد الحجم ويقل التركيز، لكن <b>كتلة المذاب وعدد مولاته يبقيان ثابتين</b>:</p>
<div class="eq">M₁ × V₁ = M₂ × V₂</div>
<p class="note">⚠️ V₂ = الحجم النهائي = V₁ + حجم الماء المضاف. وحجم الماء اللازم = V₂ − V₁.</p>`,

{id:'u2l3', unit:2, n:3, title:'الحسابات الكيميائية', en:'Stoichiometry', pages:'75 - 84',
 idea:'تستند الحسابات الكيميائية المبنية على المادة المحددة للتفاعل إلى المقارنة بين المولات اللازمة للتفاعل والمولات المتوافرة، وتتحدد كمية المادة الناتجة بناءً على المادة المحددة.',
 goals:['أستنتج من التفاعل الكيميائي المادة المحددة للتفاعل والفائضة عنه، ثم أحسب كتلة كل منهما.','أحسب كتلة مادة ناتجة بمعرفة المادة المحددة للتفاعل.'],
 content:`
<p>عند خلط كميات معلومة من مواد متفاعلة بنسبة لا تتطابق مع النسب المولية في المعادلة الموزونة، يتوقف التفاعل باستهلاك إحدى المواد كليًا.</p>
<ul><li><b>المادة المحددة للتفاعل (Limiting Reactant):</b> المادة التي تُستهلك كليًا في التفاعل وتحدد كمية المادة الناتجة.</li>
<li><b>المادة الفائضة (Excess Reactant):</b> المادة التي لم تُستهلك كليًا في أثناء التفاعل.</li></ul>
<div class="box ex"><b>مثال:</b> 2H₂ + O₂ → 2H₂O. عند تفاعل 10 mol H₂ مع 7 mol O₂: يلزم 10 mol H₂ ← 5 mol O₂ فقط. إذن H₂ هي المحددة، ويتبقى 2 mol O₂ (فائضة)، وينتج 10 mol H₂O.</div>
<h3>خطوات تحديد المادة المحددة وحساب الناتج</h3>
<ol><li>حوّل كميات المتفاعلات إلى مولات:<br>n = m ÷ Mr &nbsp;أو&nbsp; n = M × V(L)</li>
<li>من المعادلة الموزونة حدد النسبة المولية بين المتفاعلين.</li>
<li>احسب المولات اللازمة من إحدى المادتين:<br><b>المولات المطلوبة = النسبة المولية × المولات المتوافرة</b></li>
<li>قارن: إذا كانت المولات المتوافرة من المادة أقل مما يلزم ← هي <b>المحددة</b>، والأخرى فائضة.</li>
<li>احسب مولات الناتج من مولات المادة المحددة ثم كتلته: m = n × Mr.</li>
<li>كتلة الفائض = الكتلة المتوافرة − الكتلة المتفاعلة.</li></ol>
<div class="box key"><b>طريقة سريعة للتحقق:</b> اقسم مولات كل متفاعل على معامله في المعادلة؛ المادة ذات الناتج الأصغر هي المحددة.</div>
<h3>اقتصاد الذرة (Atom Economy)</h3>
<p>مقياس لكفاءة التفاعل الكيميائي من حيث استخدام ذرات المواد المتفاعلة جميعها لتكوين النواتج المرغوب فيها وتقليل النواتج غير المرغوب فيها.</p>
<div class="eq">اقتصاد الذرة = (كتلة الناتج المرغوب فيه ÷ مجموع كتل المواد المتفاعلة) × 100%</div>
<ul><li>H₂SO₄ + 2NaCl → 2HCl + Na₂SO₄ : اقتصاد الذرة ≈ <b>34%</b> (73 ÷ 215) لوجود ناتج ثانوي Na₂SO₄.</li>
<li>H₂ + Cl₂ → 2HCl : اقتصاد الذرة <b>100%</b> لعدم وجود نواتج ثانوية.</li></ul>
<h3>الكيمياء الخضراء (إثراء)</h3>
<p>فرع يهدف إلى تصميم تفاعلات تستخدم كمية اقتصادية من المواد الخام لإنتاج أكبر كمية من المادة المرغوبة، والحد من استنزاف الموارد والتخلص من النفايات والمواد السامة. وضع أناستس ووارنر 12 مبدأً لها منها: تجنب المخلفات، اقتصاد الذرة، كفاءة الطاقة، مواد أولية متجددة، التصميم للتحلل، العوامل المساعدة، تجنب المواد السامة.</p>`,
 terms:[
  ['المادة المحددة للتفاعل','Limiting Reactant','المادة التي تُستهلك كليًا في التفاعل وتحدد كمية الناتج المتكون.'],
  ['المادة الفائضة','Excess Reactant','المادة التي لم تُستهلك كاملة في أثناء التفاعل.'],

<p>تستخدم شاشات الحاسوب المحمول والساعات الرقمية والميكروويف <b>البلّورات السائلة</b> التي تجمع خصائص المواد الصلبة (ترتيب جزيئاتها باتجاهات محددة) والسائلة (انتقالها من موقع لآخر). قوى التجاذب ثنائية القطب بين جزيئاتها ضعيفة نسبيًا، فتكفي طاقة قليلة لتحرير جزيئاتها. وتتأثر جزيئاتها ثنائية القطب بالمجال الكهربائي والضوء فتترتب بطريقة معينة تسمح بمرور الضوء وعرض الألوان بالاستقطاب.</p>`,
u2l1:`<h3>🧪 التجربة 1: تفاعل الترسيب</h3>
<p><b>المواد والأدوات:</b> محلول كبريتات النحاس (II) CuSO₄ تركيزه 1 M، محلول NaOH تركيزه 1 M، ثلاث كؤوس 200 mL، مخباران مدرّجان 100 mL.</p>
<ol><li>أقيس 10 mL من CuSO₄ وأضعها في كأس.</li><li>أنظف المخبار بالماء المقطر وأكرر مع 10 mL من NaOH في كأس أخرى.</li><li>أسكب محتويات الكأسين في الكأس الثالثة وأحركها بلطف وأسجل ملاحظاتي.</li></ol>
<div class="box key"><b>الملاحظة:</b> يتكوّن راسب أزرق من هيدروكسيد النحاس (II).<div class="eq">CuSO₄(aq) + 2NaOH(aq) → Cu(OH)₂(s) + Na₂SO₄(aq)</div><div class="eq">Cu²⁺(aq) + 2OH⁻(aq) → Cu(OH)₂(s)</div><b>التفسير:</b> تبادل الأيونات الموجبة، فتتحد Cu²⁺ مع OH⁻ مكوّنة مادة غير ذائبة (تفاعل إحلال مزدوج/ترسيب).</div>
<h3>🧪 التجربة 2: تفاعل التعادل</h3>
<p><b>المواد والأدوات:</b> محلول KOH تركيزه 0.01 M، محلول HCl تركيزه 0.01 M، ماء مقطر، ثلاث كؤوس، مخبار مدرّج، ساق زجاجية، مقياس pH أو أوراق الكاشف العام.</p>
<ol><li>أقيس 10 mL من HCl في كأس، وأقيس قيمة pH وأسجلها.</li><li>أنفذ الخطوتين نفسيهما لمحلول KOH.</li><li>أخلط المحلولين في كأس ثالثة وأحرك مدة دقيقتين.</li><li>أقيس pH للخليط وأسجل.</li></ol>
<div class="box key"><b>النتائج المتوقعة:</b> pH لحمض HCl (0.01 M) ≈ 2، ولـ KOH (0.01 M) ≈ 12، وللخليط ≈ 7 (متعادل).<div class="eq">HCl(aq) + KOH(aq) → KCl(aq) + H₂O(l)</div><b>التفسير:</b> تتحد أيونات H⁺ مع OH⁻ بنسب متساوية فتكوّن الماء، ويتكون ملح متعادل.<br><b>مصادر الخطأ المحتملة:</b> عدم دقة قياس الحجوم، تلوث الأدوات أو عدم تنظيف المخبار، عدم معايرة مقياس pH، اختلاف تراكيز المحاليل المحضّرة عن المطلوب.</div>
<h3>🌍 الربط بالحياة</h3>
<ul><li><b>التحليل الكهربائي للماء:</b> 2H₂O(l) → 2H₂(g) + O₂(g) — النسبة بين حجمي H₂ و O₂ هي 2:1.</li>
<li><b>التخمّر اللاهوائي:</b> تفاعل تحلل تقوم به كائنات حية دقيقة دون حاجة للحرارة، واستُخدم في تحضير اللبن والخبز والخل.</li>
<li><b>تفاعل الثيرمايت:</b> 2Al + Fe₂O₃ → 2Fe + Al₂O₃ + حرارة — يُستخدم في لحام قضبان السكك الحديدية.</li>
<li><b>الربط بالطب:</b> أقراص مضادات الحموضة تحتوي قاعدة مثل Mg(OH)₂ تعادل حمض HCl الزائد في المعدة فتختفي الحرقة.</li>
<li><b>يوديد الرصاص PbI₂:</b> راسب أصفر ناتج من Pb(NO₃)₂ و KI، يُستخدم في صناعة الدهانات.</li></ul>`,
u2l2:`<h3>🧪 التجربة 3: المحلول القياسي</h3>
<p><b>المواد والأدوات:</b> بيرمنغنات البوتاسيوم KMnO₄، ميزان حساس، دورق حجمي 500 mL، ماء مقطر، ساق تحريك، كأس 100 mL، ملعقة، صحن زجاجي، قطارة.</p>
<ol><li>أقيس 0.79 g من KMnO₄ بالميزان الحساس.</li><li>أضعها في الكأس وأضيف قليلًا من الماء المقطر وأحرك حتى تذوب تمامًا.</li><li>أسكب المحلول في الدورق الحجمي.</li><li>أكرر شطف الكأس بالماء المقطر وسكبه في الدورق حتى يقترب المستوى من العلامة.</li><li>أضيف الماء بالقطارة حتى يصبح تقعّر المحلول عند العلامة، ثم أرجّ حتى يتجانس.</li></ol>
<div class="box key"><b>التحليل:</b><br>1) n = 0.79 ÷ 158 = <b>0.005 mol</b><br>2) M = 0.005 ÷ 0.5 = <b>0.01 M</b><br>3) عند إضافة مذيب آخر يقل التركيز؛ لأن الحجم يزداد بينما يبقى عدد مولات المذاب ثابتًا.</div>
<h3>🩺 الربط بالصحة</h3><p>لتحضير محلول ملح طعام 8% بالكتلة: تذاب 8 g ملح في قليل من الماء ثم يُضاف الماء حتى تصبح الكتلة 100 g (أي 92 g ماء). والمحلول الملحي الفسيولوجي 0.9% يُستخدم لتعويض السوائل.</p>
<h3>🏭 الربط بالصناعة: الديزل الحيوي</h3><p>يُنتج من موارد نباتية وحيوانية، قابل للتحلل الحيوي وغير سام ولا يحتوي الكبريت تقريبًا. يُمزج بديزل النفط لتكوين ديزل ممزوج: <b>20% بالحجم ديزل حيوي و 80% ديزل نفطي</b>.</p>
<h3>💊 الربط بالمهن: فنيّو الصيدلة</h3><p>يحضّرون الأدوية والمحاليل بتراكيز دقيقة، ويحسبون كميات المواد اللازمة باستخدام المولارية والنسب المئوية.</p>
<h3>🔎 أبحث: طريقتا الجزء من المليون والعيارية <span class="note">(إثراء)</span></h3>
<ul><li><b>الجزء من المليون (ppm):</b> ppm = (كتلة المذاب ÷ كتلة المحلول) × 10⁶ — تُستخدم للتراكيز الضئيلة جدًا، مثل نسبة الفلورايد في مياه الشرب، والملوثات والمعادن الثقيلة في الماء والهواء.</li>
<li><b>العيارية (N):</b> عدد المكافئات الغرامية للمذاب في لتر من المحلول؛ وترتبط بالمولارية: N = M × عدد المكافئات (مثلًا H₂SO₄ تركيزه 1 M عياريته 2 N). تُستخدم في المعايرة (حمض–قاعدة).</li></ul>`,
u2l3:`<h3>♻️ الإثراء والتوسع: الكيمياء الخضراء</h3>
<p>فرع من الكيمياء يرتكز على مبادئ تهدف إلى تصميم تفاعلات تستخدم كمية اقتصادية من المواد الخام لإنتاج أكبر كمية من المادة المرغوبة، والحد من استنزاف الموارد الطبيعية، والتخلص من النفايات والمواد الضارة السامة، وتقليل استخدام الطاقة غير المتجددة، وإنتاج مواد تتحلل بعد استخدامها.</p>
<p>وضع العالمان <b>أناستس ووارنر</b> اثني عشر مبدأً للكيمياء الخضراء، منها:</p>
<div class="chips">${['تجنّب المخلّفات','اقتصاد الذرة','تجنّب المواد السامة','تقليل المشتقات','مواد أولية قابلة للتجدد','التصميم للتحلل','العوامل المساعدة','كفاءة الطاقة','مراقبة السلامة','مراقبة الجودة'].map(x=>`<span class="chip">${x}</span>`).join('')}</div>
<h3>🎯 لماذا تهمّنا المادة المحددة؟</h3>
<p>في الصناعة تُستخدم المادة الأرخص بكمية فائضة لضمان استهلاك المادة الأغلى كليًا، وبمعرفة المادة المحددة نحسب أكبر كمية ممكنة من الناتج ونقلل الهدر.</p>`
};

 {q:'4) عنصران X و Y من الدورة الثانية يكوّنان مع الفلور XF₂ و YF₂. المركب XF₂ فيه أزواج غير رابطة و YF₂ لا يحتوي. (أ) تركيب لويس (ب) العدد الذري (جـ) الأفلاك المستخدمة (د) الشكل والقطبية (هـ) الزاوية.',a:'X هو الأكسجين (Z = 8) ← OF₂، و Y هو البيريليوم (Z = 4) ← BeF₂.<br>(أ) OF₂: O مركزية بين ذرتي F وعليها زوجان غير رابطين. BeF₂: F–Be–F دون أزواج غير رابطة على Be.<br>(جـ) O تستخدم أفلاكًا مهجنة <b>sp³</b>، و Be تستخدم <b>sp</b>، وتتداخل مع أفلاك 2p للفلور.<br>(د) OF₂ منحنٍ قطبي، BeF₂ خطي غير قطبي.<br>(هـ) OF₂ أقل من 109.5° (≈ 104.5° كالماء تقريبًا)، BeF₂ = 180°.'},

const u22 = L_('u2l2');
u22.idea = 'يمكن التعبير عن تركيز المحلول بالكسر المولي والنسبة المئوية والمولارية والمولالية.';
u22.content = u22.content.replace('<h3>1) النسبة المئوية بالكتلة (m%)</h3>',`<h3>الكسر المولي (X)</h3>
<p>النسبة بين عدد مولات المادة المذابة أو المذيب في المحلول إلى عدد المولات الكلية للمذاب والمذيب:</p>
<div class="eq">X(المذيب) = nₐ ÷ (nₐ + n_b) &nbsp;&nbsp;&nbsp; X(المذاب) = n_b ÷ (nₐ + n_b)</div>
<p class="note">nₐ: مولات المذيب ، n_b: مولات المذاب. مجموع الكسور المولية لمكونات المحلول = 1، ويمكن التعبير عنه بنسبة مئوية (× 100%).</p>
<div class="box ex"><b>مثال:</b> محلول فيه 4 mol ماء و 1.25 mol غاليكول الإيثيلين:<br>X(H₂O) = 4 ÷ 5.25 = <b>0.762</b> (76.2%) ، X(EG) = 1.25 ÷ 5.25 = <b>0.238</b> (23.8%)</div>
<h3>1) النسبة المئوية بالكتلة (m%)</h3>`);
u22.terms.splice(2,0,['الكسر المولي','Mole Fraction (X)','النسبة بين عدد مولات المادة المذابة أو المذيب في المحلول إلى عدد المولات الكلية للمذاب والمذيب.']);
u22.examples.unshift(

const u23 = L_('u2l3');
u23.content = u23.content.replace('<h3>اقتصاد الذرة (Atom Economy)</h3>',`<h3>المردود المئوي (Percent Yield)</h3>
<ul><li><b>المردود النظري (Py):</b> كمية الناتج المحسوبة من المعادلة الموزونة اعتمادًا على المادة المحددة.</li>
<li><b>المردود الفعلي (Ay):</b> كمية الناتج التي يُحصل عليها فعليًا من التجربة، وتكون عادةً أقل من النظري.</li></ul>
<div class="eq">Y% = (Ay ÷ Py) × 100%</div>
<div class="box ex"><b>مثال:</b> في تفاعل 50 g P₄ مع 100 g O₂ كان المردود النظري لـ P₄O₁₀ = 113.6 g، والمردود الفعلي 84.6 g:<br>Y% = (84.6 ÷ 113.6) × 100% = <b>74.5%</b></div>

/* ================= الوحدة 3 - الدرس 1 ================= */
{id:'u3l1', sem:2, unit:3, n:1, title:'المركّبات الهيدروكربونية المشبعة (الألكانات)', en:'Saturated Hydrocarbons', pdf:[11,26], pages:'10 - 25',
 idea:'تتكون المركّبات الهيدروكربونية المشبعة من الكربون والهيدروجين فقط، وترتبط فيها ذرات الكربون بأربع روابط أحادية، ويُطلق عليها الألكانات، وتُسمّى وفق نظام IUPAC، ولها خصائص كيميائية وفيزيائية محددة.',
 goals:['أتعرف الألكانات.','أسمّي الألكانات وفق نظام IUPAC.','أستنتج خصائص الألكانات واستخداماتها في الحياة العملية.'],
 content:`
<h3>1) مقدمة في الكيمياء العضوية</h3>
<p><b>المركّبات العضوية:</b> المركّبات التي تتكون بشكل رئيس من الكربون، باستثناء أكاسيد الكربون والكربيدات والكربونات. سُمّيت عضوية لأنها كانت تُستخرج من كائنات حية، وسادت فكرة «القوة الحيوية» حتى حضّر العالم <b>فريدريك فوهلر</b> اليوريا (NH₂CONH₂) من مركب غير عضوي هو سيانات الأمونيوم (NH₄OCN).</p>
<p>تتميز ذرة الكربون بقدرتها على تكوين <b>أربع روابط تساهمية</b> مع ذرات كربون أخرى أو عناصر أخرى، وتكوين سلاسل وحلقات بسيطة أو معقدة.</p>
<h3>2) المركّبات الهيدروكربونية</h3>
<p>تتكون من <b>الكربون والهيدروجين فقط</b>، وأبسطها الميثان CH₄ (المكوّن الرئيس للغاز الطبيعي المستخرج من حقل الريشة في الأردن).</p>
<table><tr><th>النوع</th><th>الوصف</th></tr>
<tr><td>الهيدروكربونات المشبعة (الألكانات)</td><td>روابط أحادية فقط بين ذرات الكربون</td></tr>
<tr><td>الهيدروكربونات غير المشبعة</td><td>رابطة ثنائية أو ثلاثية واحدة على الأقل بين ذرتي كربون</td></tr>
<tr><td>المركّبات الأروماتية</td><td>تحتوي حلقة بنزين أو أكثر، وذات روائح مميزة</td></tr></table>
<h3>3) الألكانات وصيغتها العامة</h3>
<p>مركّبات هيدروكربونية تحوي روابط تساهمية أحادية فقط، وصيغتها العامة: </p>${EQ('CₙH₂ₙ₊₂')}
<table><tr><th>عدد C</th><th>البادئة</th><th>الاسم</th><th>الصيغة</th></tr>
<tr><td>1</td><td>ميث</td><td>ميثان</td><td>CH₄</td></tr><tr><td>2</td><td>إيث</td><td>إيثان</td><td>C₂H₆</td></tr><tr><td>3</td><td>بروب</td><td>بروبان</td><td>C₃H₈</td></tr><tr><td>4</td><td>بيوت</td><td>بيوتان</td><td>C₄H₁₀</td></tr><tr><td>5</td><td>بنت</td><td>بنتان</td><td>C₅H₁₂</td></tr><tr><td>6</td><td>هكس</td><td>هكسان</td><td>C₆H₁₄</td></tr><tr><td>7</td><td>هبت</td><td>هبتان</td><td>C₇H₁₆</td></tr><tr><td>8</td><td>أوكت</td><td>أوكتان</td><td>C₈H₁₈</td></tr><tr><td>9</td><td>نون</td><td>نونان</td><td>C₉H₂₀</td></tr><tr><td>10</td><td>ديك</td><td>ديكان</td><td>C₁₀H₂₂</td></tr></table>
<p>كل ألكان يزيد على الذي قبله بمجموعة CH₂. تُكتب الصيغ بصورة <b>بنائية مختصرة</b> (CH₃CH₂CH₃)، أو <b>مفصلة</b> (تظهر الروابط جميعها)، أو <b>هيكلية</b> (كل زاوية وطرف ذرة كربون).</p>
<h3>4) مجموعات الألكيل (R)</h3>
<p>تفرعات مشتقة من الألكان بحذف ذرة هيدروجين واحدة، صيغتها العامة CₙH₂ₙ₊₁، وتُسمّى بتغيير المقطع (ان) إلى (يل):</p>
<table><tr><th>الألكان</th><th>الألكيل</th><th>الصيغة</th></tr><tr><td>ميثان</td><td>ميثيل</td><td>CH₃−</td></tr><tr><td>إيثان</td><td>إيثيل</td><td>CH₃CH₂− (C₂H₅−)</td></tr><tr><td>بروبان</td><td>بروبيل</td><td>CH₃CH₂CH₂− (C₃H₇−)</td></tr></table>
<h3>5) قواعد تسمية الألكانات المتفرعة (IUPAC)</h3>
<ol><li>أحدد <b>أطول سلسلة مستمرة</b> من ذرات الكربون وأسميها باسم الألكان المقابل.</li>
<li>أرقّم السلسلة من الطرف <b>الأقرب إلى التفرع</b> لتأخذ التفرعات أقل الأرقام الممكنة.</li>
<li>أسمّي كل تفرع وأضع اسمه قبل اسم السلسلة الرئيسة.</li>
<li>أكتب رقم التفرع ثم شرطة ثم اسمه. للتفرعات المتشابهة أستخدم البادئات (ثنائي، ثلاثي، رباعي) وأفصل بين أرقامها بفاصلة. للتفرعات المختلفة أرتبها <b>هجائيًا باللغة الإنجليزية</b> (إيثيل قبل ميثيل) دون مراعاة البادئات.</li>
<li>أكتب الاسم كاملًا: رقم التفرع − اسم التفرع + اسم الألكان.</li></ol>
<div class="box ex"><b>أمثلة:</b><br>CH₃CH(CH₃)CH₂CH₂CH₂CH₃ ← <b>2-ميثيل هكسان</b> (وليس 5-ميثيل)<br>CH₃CH(CH₃)CH(CH₃)CH₂CH₂CH₃ ← <b>2،3-ثنائي ميثيل هكسان</b> (مجموع الأرقام 5 أقل من 9)<br>سلسلة من 9 ذرات وعليها ميثيل على C2 وإيثيل على C6 ← <b>6-إيثيل-2-ميثيل نونان</b></div>
<h3>6) التصاوغ والمتصاوغات البنائية</h3>
<p><b>التصاوغ:</b> وجود صيغ بنائية مختلفة للصيغة الجزيئية نفسها. <b>المتصاوغات البنائية:</b> مركّبات تختلف في ترتيب ذرات الكربون (عن السلسلة المستمرة) وتشترك في الصيغة الجزيئية، ولها خصائص فيزيائية وكيميائية مختلفة. يزداد عددها بزيادة عدد ذرات الكربون.</p>
<table><tr><th>الصيغة</th><th>المتصاوغات</th></tr><tr><td>C₄H₁₀</td><td>بيوتان ، 2-ميثيل بروبان</td></tr><tr><td>C₅H₁₂</td><td>بنتان ، 2-ميثيل بيوتان ، 2،2-ثنائي ميثيل بروبان</td></tr></table>
<h3>7) الخصائص الفيزيائية</h3>
<ul><li>غير قطبية، تتجاذب جزيئاتها بقوى لندن؛ لا تذوب في الماء وتذوب في المذيبات غير القطبية.</li>
<li>الألكانات الأربعة الأولى غازات، ومن البنتان إلى C₁₆ سوائل، وأكثر من 16 ذرة كربون صلبة.</li>
<li>تزداد درجة الغليان بزيادة عدد ذرات الكربون (الكتلة المولية) لزيادة قوى لندن.</li></ul>

{id:'u3l2', sem:2, unit:3, n:2, title:'الهيدروكربونات غير المشبعة والمركّبات الأروماتية', en:'Unsaturated Hydrocarbons and Aromatic Compounds', pdf:[27,40], pages:'26 - 39',
 idea:'تتكون المركّبات الهيدروكربونية غير المشبعة من الكربون والهيدروجين، وترتبط فيها ذرات الكربون برابطة ثنائية أو ثلاثية واحدة على الأقل، وتُعدّ المركّبات الأروماتية مركّبات غير مشبعة تتكون من حلقة بنزين أو أكثر.',
 goals:['أتعرف الألكينات والألكاينات وأسميها.','أميز الخصائص الفيزيائية والكيميائية للألكينات والألكاينات.','أتعرف المركّبات الأروماتية وخصائصها.'],
 content:`
<h3>1) الألكينات (Alkenes)</h3>
<p>تحتوي <b>رابطة ثنائية واحدة</b> على الأقل بين ذرتي كربون متجاورتين (إحداهما σ والأخرى π)، وصيغتها العامة:</p>${EQ('CₙH₂ₙ')}
<p>أصغرها <b>الإيثين</b> CH₂=CH₂ (C₂H₄).</p>
<h3>تسمية الألكينات</h3>
<ol><li>أحدد أطول سلسلة مستمرة <b>تحتوي الرابطة الثنائية</b>.</li><li>أرقّمها من الطرف <b>الأقرب إلى الرابطة الثنائية</b>.</li><li>أسميها باسم الألكان المقابل مع استبدال (ان) بـ (ين)، ويسبق الاسم رقم ذرة الكربون الأقل في الرابطة الثنائية.</li><li>أرقّم مجموعات الألكيل وأسميها كما في الألكانات.</li><li>أكتب الاسم كاملًا.</li></ol>
<div class="box ex">CH₃CH=CHCH₂CH(CH₃)CH₃ ← <b>5-ميثيل-2-هكسين</b><br>CH₂=CHCH(C₂H₅)CH₂CH(CH₃)CH₃ ← <b>3-إيثيل-5-ميثيل-1-هكسين</b></div>
<h3>الخصائص الفيزيائية للألكينات</h3>
<p>غير قطبية، لا تذوب في الماء، ودرجات غليانها منخفضة وتزداد بزيادة الكتلة المولية. الثلاثة الأولى غازات، ثم سوائل حتى C₁₅، ثم صلبة.</p>
<table><tr><th>الألكين</th><th>الصيغة</th><th>غليان °C</th></tr><tr><td>إيثين</td><td>CH₂=CH₂</td><td>-104</td></tr><tr><td>بروبين</td><td>CH₃CH=CH₂</td><td>-47</td></tr><tr><td>1-بيوتين</td><td>CH₃CH₂CH=CH₂</td><td>-6</td></tr><tr><td>1-بنتين</td><td>CH₃(CH₂)₂CH=CH₂</td><td>30</td></tr><tr><td>1-ديكين</td><td>CH₃(CH₂)₇CH=CH₂</td><td>171</td></tr></table>
<h3>الخصائص الكيميائية للألكينات</h3>
<p>أنشط من الألكانات لوجود الرابطة π الضعيفة سهلة الكسر، التي تُعدّ مركز النشاط الكيميائي.</p>
<p><b>الاحتراق:</b></p>${EQ('C₂H₄ + 3O₂ → 2CO₂ + 2H₂O + طاقة')}
<p><b>الأكسدة بمحلول بيرمنغنات البوتاسيوم KMnO₄ البارد (البنفسجي):</b> تنكسر الرابطة الثنائية وينتج مركب فيه مجموعتا OH، ويتكون راسب <b>بني محمر</b> من MnO₂ ويختفي اللون البنفسجي:</p>${EQ('3CH₂=CH₂ + 2KMnO₄ + 4H₂O → 3CH₂OHCH₂OH + 2KOH + 2MnO₂')}
<div class="box key">يُستخدم هذا التفاعل للتمييز بين الألكينات والألكانات: الألكين يزيل اللون البنفسجي ويكوّن راسبًا بنيًا، أما الألكان فلا يتفاعل ويبقى اللون البنفسجي.</div>
<p><b>تفاعلات الإضافة:</b> ترتبط ذرات أخرى بذرتي كربون الرابطة الثنائية فتنكسر π وينتج مركب مشبع. مثل إضافة الهيدروجين بوجود عامل مساعد (Ni أو Pt):</p>${EQ('CH₂=CH₂ + H₂ →(Ni) CH₃CH₃')}
<h3>2) الألكاينات (Alkynes)</h3>
<p>تحتوي <b>رابطة ثلاثية واحدة</b> على الأقل، صيغتها العامة:</p>${EQ('CₙH₂ₙ₋₂')}
<p>أصغرها <b>الإيثاين</b> HC≡CH (الأسيتيلين) ويُستخدم في قص الفلزات ولحامها، وتُستخدم الألكاينات مذيبات عضوية.</p>
<p><b>التسمية:</b> بالطريقة نفسها مع استبدال (ان) بـ (اين)، والترقيم من الطرف الأقرب إلى الرابطة الثلاثية.</p>
<div class="box ex">CH₃C≡CCH₂CH₂CH(CH₃)CH₃ ← <b>6-ميثيل-2-هبتاين</b><br>4-إيثيل-1-هكساين ← HC≡CCH₂CH(C₂H₅)CH₂CH₃</div>
<table><tr><th>الألكاين</th><th>الصيغة</th><th>غليان °C</th><th>الحالة</th></tr><tr><td>إيثاين</td><td>HC≡CH</td><td>-84</td><td>غاز</td></tr><tr><td>بروباين</td><td>CH₃C≡CH</td><td>-23</td><td>غاز</td></tr><tr><td>1-بيوتاين</td><td>CH₃CH₂C≡CH</td><td>—</td><td>غاز</td></tr><tr><td>1-بنتاين</td><td>CH₃(CH₂)₂C≡CH</td><td>40</td><td>سائل</td></tr></table>
<p><b>الخصائص الكيميائية:</b> تحتوي رابطتي π ضعيفتين؛ تحترق وتدخل في تفاعلات الإضافة. يحتاج الألكاين إلى <b>جزيئين</b> من H₂ ليصبح ألكانًا:</p>${EQ('2C₂H₂ + 5O₂ → 4CO₂ + 2H₂O + طاقة')}${EQ('HC≡CH + 2H₂ →(Ni) CH₃CH₃')}
<h3>3) المركّبات الأروماتية (البنزين)</h3>
<p>مركّبات هيدروكربونية تتكون من حلقة بنزين أو أكثر، ذات روائح مميزة. استخلص <b>فارادي</b> البنزين عام 1825م، وصيغته C₆H₆.</p>
<p>اقترح <b>كيكوله</b> حلقة سداسية فيها 3 روابط أحادية و3 ثنائية متعاقبة، لكنها لم تفسر تساوي أطوال الروابط وضعف النشاط الكيميائي؛ فاقترح أن إلكترونات الروابط الثنائية <b>متحركة تتوزع بانتظام في الحلقة على صورة غيمة إلكترونية</b>، وتُمثّل بحلقة سداسية داخلها دائرة.</p>
<ul><li>حلقة البنزين مستقرة، ونشاطها أقل من الألكينات والألكاينات.</li><li>البنزين مذيب عضوي غير قطبي، لا يذوب في الماء، سائل متطاير ذو رائحة مميزة، يغلي عند 80°C.</li><li>الإكثار من التعرض للمركّبات الأروماتية يسبب أمراض الجهاز التنفسي والكبد والجهاز العصبي وقد يسبب السرطان.</li><li>مثال: الفانيلين C₈H₈O₃ يعطي رائحة الفانيليا.</li></ul>`,

/* ================= الوحدة 4 - الدرس 1 ================= */
{id:'u4l1', sem:2, unit:4, n:1, title:'هاليدات الألكيل، الكحولات، الإيثرات والأمينات', en:'Alkyl Halides, Alcohols, Ethers and Amines', pdf:[47,67], pages:'46 - 66',
 idea:'عندما تحل مجموعة وظيفية محل ذرة هيدروجين أو أكثر في المركّبات الهيدروكربونية يتكون مركب جديد له خصائص فيزيائية وكيميائية مختلفة تميزه عن غيره.',
 goals:['أميز هاليدات الألكيل والكحولات والإيثرات والأمينات بناءً على المجموعة الوظيفية.','أطبق قواعد التسمية وفق نظام IUPAC وأكتب صيغًا بنائية.','أفسر بعض الخصائص الفيزيائية بناءً على التركيب البنائي.'],
 content:`
<h3>1) المجموعات الوظيفية</h3>
<p><b>مشتقات المركّبات الهيدروكربونية:</b> مركّبات تحتوي -إضافة للكربون والهيدروجين- ذرة أو أكثر من عناصر أخرى مثل الأكسجين أو الهالوجين أو النيتروجين.</p>
<p><b>المجموعة الوظيفية:</b> الذرة أو مجموعة الذرات أو الروابط المسؤولة عن الخصائص المميزة للمركّب، وتُعدّ مركز النشاط الكيميائي فيه.</p>
<table><tr><th>نوع المركّب</th><th>المجموعة الوظيفية</th><th>الصيغة العامة</th></tr>
<tr><td>الألكينات</td><td>رابطة ثنائية C=C</td><td>—</td></tr><tr><td>الألكاينات</td><td>رابطة ثلاثية C≡C</td><td>—</td></tr>
<tr><td>هاليدات الألكيل</td><td>هالوجين −X</td><td>R−X</td></tr><tr><td>الكحولات</td><td>هيدروكسيل −OH</td><td>R−OH</td></tr>
<tr><td>الإيثرات</td><td>إيثر −O−</td><td>R−O−R</td></tr><tr><td>الأمينات</td><td>أمين −NH₂</td><td>R−NH₂</td></tr>
<tr><td>الألديهايدات</td><td>كربونيل (طرفية)</td><td>R−CHO</td></tr><tr><td>الكيتونات</td><td>كربونيل</td><td>R−CO−R</td></tr>
<tr><td>الحموض الكربوكسيلية</td><td>كربوكسيل −COOH</td><td>R−COOH</td></tr><tr><td>الإسترات</td><td>إستر −COO−</td><td>R−COO−R</td></tr></table>
<h3>2) هاليدات الألكيل (R−X)</h3>
<p>مركّبات هيدروكربونية حلت فيها ذرة هالوجين أو أكثر (F, Cl, Br, I) محل ذرة هيدروجين أو أكثر. تنتجها بعض الكائنات البحرية (الأعشاب البحرية تنتج CH₃Cl).</p>
<p><b>الأسماء الشائعة:</b> هاليد + الألكيل: CH₃F فلوريد الميثيل ، CHCl₃ الكلوروفورم ، CH₃CH₂Br بروميد الإيثيل.</p>
<p><b>تسمية IUPAC:</b> يُعامل الهالوجين كتفرع (فلورو، كلورو، برومو، يودو) على سلسلة الألكان، وتُرتّب التفرعات هجائيًا بالإنجليزية:</p>
<div class="box ex">CH₃CH(Br)CH₂CH₂CH₃ ← <b>2-برومو بنتان</b><br>CH₃CH(Cl)CH₂CH(CH₃)CH₂CH₃ ← <b>2-كلورو-4-ميثيل هكسان</b><br>CH₃CBr₂CH₂Cl ← <b>2،2-ثنائي برومو-1-كلورو بروبان</b></div>
<p><b>الخصائص:</b> الرابطة C−X قطبية فهاليدات الألكيل قطبية وتترابط بقوى ثنائية القطب؛ لذا درجة غليانها أعلى من الألكان المقارب. وتزداد درجة الغليان بزيادة الكتلة الذرية للهالوجين:</p>
<table><tr><th>المركّب</th><th>CH₃CH₃</th><th>CH₃CH₂F</th><th>CH₃CH₂Cl</th><th>CH₃CH₂Br</th></tr><tr><td>الغليان °C</td><td>-89</td><td>-37</td><td>12</td><td>38</td></tr></table>
<p>لا تذوب غالبًا في الماء رغم قطبيتها؛ لأن قوى ثنائية القطب بينها وبين الماء أضعف من الروابط الهيدروجينية بين جزيئات الماء.</p>
<p><b>استخدامات:</b> الكلوروفورم مخدر قديمًا ثم حل محله الهالوثان، ثلاثي كلورو إيثين مذيب في الصناعات الإلكترونية، CCl₃F مادة نفخ للبلاستيك الرغوي، كلورو إيثين لصناعة بلاستيك أنابيب المياه، والهيدروفلوروكربونات غازات تبريد.</p>
<div class="box key"><b>الربط بالبيئة:</b> مركّبات CFCs مثل CCl₂F₂ تتحلل بالأشعة فوق البنفسجية محررة ذرة كلور تفكك آلاف جزيئات الأوزون؛ فحلّت محلها مركّبات HFCs مثل CF₃CH₂F.</div>
<h3>3) الكحولات (R−OH)</h3>
<p>مجموعتها الوظيفية الهيدروكسيل −OH، وهي المادة الفاعلة في معقمات الأيدي. تُسمّى بإضافة المقطع (ول) إلى اسم الألكان (ألكانول)، والترقيم من الطرف الأقرب لمجموعة OH:</p>
<div class="box ex">CH₃CH(OH)CH(CH₃)CH₃ ← <b>3-ميثيل-2-بيوتانول</b><br>CH₃CH₂C(CH₃)(OH)CH₂CH(CH₃)CH₂CH₃ ← <b>3،5-ثنائي ميثيل-3-هبتانول</b></div>
<table><tr><th>النوع</th><th>مثال</th><th>الاسم الشائع</th><th>النظامي</th></tr><tr><td>أحادي الهيدروكسيل</td><td>CH₃CH₂OH</td><td>كحول الإيثيل</td><td>إيثانول</td></tr><tr><td>ثنائي الهيدروكسيل</td><td>HOCH₂CH₂OH</td><td>جلايكول الإيثلين</td><td>1،2-إيثان دايول</td></tr><tr><td>ثلاثي الهيدروكسيل</td><td>HOCH₂CH(OH)CH₂OH</td><td>الجليسرول</td><td>1،2،3-بروبان ترايول</td></tr></table>
<p><b>الخصائص:</b> مجموعة OH شديدة القطبية فتترابط جزيئات الكحول بروابط هيدروجينية؛ لذا درجات غليانها أعلى كثيرًا من الألكانات المقاربة (الميثانول 65°C والإيثان -89°C)، وتزداد بزيادة عدد ذرات الكربون لزيادة قوى لندن بين الأطراف R.</p>
<p>تذوب الكحولات في الماء بتكوين روابط هيدروجينية معه، <b>وتقل ذائبيتها بزيادة طول السلسلة R</b> غير القطبية: الإيثانول والبروبانول يذوبان بأي نسبة، 1-بيوتانول 7.9 g، 1-بنتانول 2.7 g لكل 100 g ماء.</p>
<p class="note">جلايكول الإيثلين مضاد للتجمد (درجة غليانه 197°C، وخلطه 50% مع الماء يخفض التجمد إلى -36°C)، والجليسرول يمتص الماء فيدخل في المرطبات.</p>
<h3>4) الإيثرات (R−O−R)</h3>
<p>ترتبط ذرة الأكسجين بمجموعتي ألكيل متشابهتين أو مختلفتين. تُسمّى بذكر مجموعتي الألكيل (هجائيًا) ثم كلمة إيثر، والبادئة ثنائي للمتماثلتين: CH₃OCH₃ ثنائي ميثيل إيثر ، CH₃CH₂OCH₂CH₂CH₃ إيثيل بروبيل إيثر.</p>
<div class="box key"><b>التصاوغ الوظيفي:</b> مركّبات تشترك في الصيغة الجزيئية وتختلف في المجموعة الوظيفية؛ مثل الإيثانول CH₃CH₂OH وثنائي ميثيل إيثر CH₃OCH₃ (C₂H₆O). الصيغة العامة للكحولات والإيثرات: CₙH₂ₙ₊₂O.</div>
<p><b>الخصائص:</b> جزيئات الإيثر قطبية (الشكل منحنٍ) وتترابط بقوى ثنائية القطب ضعيفة؛ فدرجات غليانها قريبة من الألكانات المقاربة (ثنائي إيثيل إيثر 34.6°C والبنتان 36.1°C). تذوب في الماء لأن الأكسجين يملك زوجين غير رابطين يكوّن روابط هيدروجينية مع الماء، وتقل الذائبية بزيادة طول السلسلة. تُستخدم مذيبات عضوية، واستُخدم ثنائي إيثيل إيثر مخدرًا عامًا.</p>
<h3>5) الأمينات</h3>
<p>تُشتق من الأمونيا NH₃ بإحلال مجموعة ألكيل أو أكثر محل ذرة هيدروجين أو أكثر، وتُصنّف إلى <b>أولية</b> (R−NH₂) و<b>ثانوية</b> (R₂NH) و<b>ثالثية</b> (R₃N). رائحتها تشبه السمك الفاسد، وتُستخدم في البلاستيك والأدوية والمبيدات والأصباغ (الأنيلين C₆H₅NH₂).</p>
<p><b>الأسماء الشائعة:</b> CH₃CH₂NH₂ إيثيل أمين ، (CH₃CH₂)₂NH ثنائي إيثيل أمين ، (CH₃)₃N ثلاثي ميثيل أمين.</p>
<p><b>تسمية IUPAC للأمينات الأولية:</b> رقم ذرة الكربون المتصلة بمجموعة الأمين + أمينو + اسم الألكان:</p>
<div class="box ex">CH₃CH₂CH₂CH₂NH₂ ← <b>1-أمينو بيوتان</b><br>CH₃CH(NH₂)CH₂CH(CH₃)CH₃ ← <b>4-ميثيل-2-أمينو بنتان</b></div>
<p><b>الخصائص:</b> الأمينات قطبية، وتترابط الأمينات الأولية بروابط هيدروجينية؛ فغليانها أعلى من الألكانات المقاربة (ميثيل أمين -6°C والإيثان -89°C)، لكنه <b>أقل من الكحولات المقاربة</b> لأن قطبية N−H أقل من O−H (إيثيل أمين 16°C والإيثانول 78°C). تذوب الأمينات الأولية والثانوية في الماء، وتقل الذائبية بزيادة عدد ذرات الكربون.</p>`,

{id:'u4l2', sem:2, unit:4, n:2, title:'مركّبات الكربونيل والحموض الكربوكسيلية ومشتقاتها', en:'Carbonyl Compounds, Carboxylic Acids and Derivatives', pdf:[68,82], pages:'67 - 81',
 idea:'تتكون مجموعة الكربونيل من ذرة كربون مرتبطة برابطة ثنائية مع ذرة أكسجين، وتُعدّ مجموعة وظيفية رئيسة في بعض المركّبات، وجزءًا من مجموعات وظيفية في مركّبات أخرى.',
 goals:['أميز الألديهايدات والكيتونات والحموض الكربوكسيلية والإسترات بناءً على المجموعة الوظيفية.','أسمّي هذه المركّبات وأكتب صيغها البنائية.','أفسر بعض خصائصها الفيزيائية بناءً على تركيبها.'],
 content:`
<h3>1) الألديهايدات (R−CHO)</h3>
<p>ترتبط فيها مجموعة الكربونيل (C=O) بذرة هيدروجين واحدة على الأقل، وتقع في طرف السلسلة. تسبب نكهات مميزة (القرفة واللوز).</p>
<p><b>الأسماء الشائعة:</b> HCHO الفورمالديهايد ، CH₃CHO الأسيتالديهايد.</p>
<p><b>تسمية IUPAC:</b> إضافة المقطع (ال) إلى اسم الألكان (ألكانال)، وتأخذ مجموعة الكربونيل الرقم 1 دائمًا فلا يُكتب:</p>
<table><tr><th>الاسم</th><th>الصيغة</th></tr><tr><td>ميثانال</td><td>HCHO</td></tr><tr><td>إيثانال</td><td>CH₃CHO</td></tr><tr><td>بروبانال</td><td>CH₃CH₂CHO</td></tr></table>
<div class="box ex">CH₃CH₂CH(CH₃)CH₂CHO ← <b>3-ميثيل بنتانال</b><br>4-إيثيل هكسانال ← CH₃CH₂CH(C₂H₅)CH₂CH₂CHO</div>
<h3>2) الكيتونات (R−CO−R)</h3>
<p>ترتبط فيها مجموعة الكربونيل بمجموعتي ألكيل. تشترك مع الألديهايدات في الصيغة العامة <b>CₙH₂ₙO</b> وتختلف في الصيغة البنائية.</p>
<p><b>الأسماء الشائعة:</b> CH₃COCH₃ ثنائي ميثيل كيتون (الأسيتون، مزيل طلاء الأظافر) ، CH₃COCH₂CH₃ إيثيل ميثيل كيتون.</p>
<p><b>تسمية IUPAC:</b> إضافة المقطع (ون) إلى اسم الألكان (ألكانون)، والترقيم من الطرف الأقرب للكربونيل، ويُكتب رقمها إذا زادت السلسلة على 4 ذرات:</p>
<div class="box ex">CH₃CH₂COCH₃ ← <b>بيوتانون</b> (لا حاجة للرقم)<br>CH₃COCH₂CH₂CH₃ ← <b>2-بنتانون</b><br>CH₃CH₂CH₂CH(CH₃)COCH₂CH₃ ← <b>4-ميثيل-3-هبتانون</b></div>
<h3>خصائص الألديهايدات والكيتونات</h3>
<p>قطبية بسبب مجموعة الكربونيل وتترابط بقوى ثنائية القطب؛ فغليانها <b>أعلى من الألكانات</b> المقاربة <b>وأقل من الكحولات</b> المقاربة:</p>
<table><tr><th>المركّب</th><th>بنتان</th><th>بيوتانال</th><th>بيوتانون</th><th>1-بيوتانول</th></tr><tr><td>الغليان °C</td><td>36</td><td>76</td><td>80</td><td>118</td></tr></table>
<p>تذوب في الماء بالروابط الهيدروجينية مع جزيئاته، وتقل ذائبيتها بزيادة عدد ذرات الكربون، وتُستخدم مذيبات عضوية. البروبانون مذيب في المواد اللاصقة ومادة خام للبلاستيك، والميثانال لتحضير بلاستيك صلب، ومحلول الفورمالديهايد لحفظ العينات الحية.</p>
<h3>3) الحموض الكربوكسيلية (R−COOH)</h3>
<p>حموض عضوية مجموعتها الوظيفية الكربوكسيل −COOH. حمض الستريك في الحمضيات، واللاكتيك في الحليب، والأستيك في الخل.</p>
<p><b>التسمية:</b> كلمة حمض + اسم الألكان + المقطع (ويك): حمض ألكانويك. الكربوكسيل طرفية ورقمها 1 دائمًا:</p>
<table><tr><th>الاسم</th><th>الصيغة</th></tr><tr><td>حمض الميثانويك (الفورميك/النمليك)</td><td>HCOOH</td></tr><tr><td>حمض الإيثانويك</td><td>CH₃COOH</td></tr><tr><td>حمض البروبانويك</td><td>CH₃CH₂COOH</td></tr></table>
<div class="box ex">CH₃CH(CH₃)CH₂COOH ← <b>حمض 3-ميثيل بيوتانويك</b><br>CH₃CH(CH₃)CH(CH₃)CH₂COOH ← <b>حمض 3،4-ثنائي ميثيل بنتانويك</b></div>
<p><b>الخصائص:</b> كل جزيئين يرتبطان <b>برابطتين هيدروجينيتين</b> مكونين ثنائيًا (dimer)؛ لذا غليانها أعلى من الكحولات المساوية في الكتلة (حمض البروبانويك 141°C و 1-بيوتانول 118°C، والكتلة 74 لكليهما). تذوب في الماء وتقل الذائبية بزيادة R، وتتأين:</p>${EQ('RCOOH + H₂O ⇌ RCOO⁻ + H₃O⁺')}
<p class="note">بنزوات الصوديوم C₆H₅COONa مادة حافظة، وحمض الساليسليك في صناعة الأسبرين. لسعة النملة تفرز حمض الميثانويك، ويُعالج بمحلول كربونات الصوديوم الهيدروجينية.</p>
<h3>4) الإسترات (R−COO−R)</h3>
<p>من مشتقات الحموض الكربوكسيلية، ذات روائح عطرة (معظم روائح الأزهار ونكهات الفواكه)، وتُحضّر من تفاعل الحمض الكربوكسيلي مع الكحول.</p>
<p><b>التسمية:</b> كلمتان: اسم الحمض بالمقطع (وات) بدل (ويك)، ثم مجموعة الألكيل من الكحول: <b>ألكانوات الألكيل</b>.</p>
<div class="box ex">CH₃COOCH₃ ← <b>إيثانوات الميثيل</b><br>HCOOCH₂CH₂CH₃ ← <b>ميثانوات البروبيل</b><br>CH₃CH₂CH₂COOCH₂CH₃ ← بيوتانوات الإيثيل (رائحة الأناناس)</div>
<p><b>الخصائص:</b> قطبية لكنها لا تحتوي H مرتبطًا مباشرة بالأكسجين، فلا تكوّن روابط هيدروجينية فيما بينها؛ لذا غليانها وذائبيتها <b>أقل من الحموض</b> المساوية في الكتلة، والإسترات التي فيها أكثر من 5 ذرات كربون لا تذوب في الماء. مذيبات جيدة للدهانات، وتدخل في المواد اللاصقة وأكياس النايلون والبلاستيك.</p>`,

 idea:'المبلمرات مركّبات ضخمة طبيعية أو صناعية، لكل منها أهميته واستخداماته المرتبطة بتركيبه وخصائصه.',
 goals:['أتعرف العلاقة بين المونومرات والمبلمرات.','أفسر أثر الاختلاف في التركيب البنائي للمبلمرات في خصائصها واستخداماتها.','أكتب معادلات تكوّن بعض المبلمرات.','أتوصل إلى أهمية المبلمرات في أجسام الكائنات الحية وفي الحياة.'],
 content:`
<h3>1) المبلمرات والمونومرات</h3>
<p><b>المبلمرات:</b> جزيئات ضخمة ذات كتلة جزيئية كبيرة جدًا، تتكون من اتحاد عدد كبير من جزيئات صغيرة تسمى <b>المونومرات</b> (وحدة البناء الأساسية).</p>
<p><b>تفاعل البلمرة:</b> تفاعل تتحد فيه المونومرات ضمن ظروف مناسبة من الضغط ودرجة الحرارة ووجود عوامل مساعدة. للمبلمر خصائص تختلف عن المونومر، وتُصنّف المبلمرات إلى <b>صناعية</b> و<b>طبيعية</b>.</p>
<h3>2) المبلمرات الصناعية</h3>
<p>جزيئات ضخمة تتكون صناعيًا من اتحاد عدد كبير من المونومرات، وتُستخدم في البلاستيك والألياف الصناعية.</p>
<p><b>متعدد الإيثين (بولي إيثيلين):</b> عند تسخين الإيثين تحت ضغط كبير وبوجود عامل مساعد تنكسر الرابطة π وترتبط الجزيئات في سلسلة طويلة:</p>${EQ('nCH₂=CH₂ →(حرارة، ضغط، عامل مساعد) −(CH₂−CH₂)ₙ−')}
<p>يمكن التحكم بخصائصه بطول السلسلة (1000 مونومر أصلب من 100) وبمدى تفرعها وتشابكها:</p>
<table><tr><th>النوع</th><th>السلاسل</th><th>الخصائص</th><th>الاستخدام</th></tr>
<tr><td>عالي الكثافة HDPE</td><td>غير متفرعة متقاربة متراصة</td><td>قوي وصلب</td><td>خراطيم المياه، الحاويات، الأدوات المنزلية، عزل الأسلاك</td></tr>
<tr><td>منخفض الكثافة LDPE</td><td>متفرعة تعيق التراص</td><td>أقل صلابة وقوة</td><td>الأكياس البلاستيكية</td></tr>
<tr><td>متشابك</td><td>سلاسل مرتبطة ببعضها</td><td>أكثر صلابة من HDPE</td><td>منتجات شديدة الصلابة</td></tr></table>
<p><b>متعدد البروبين (بولي بروبلين):</b> من بلمرة البروبين CH₂=CHCH₃، أكثر صلابة من متعدد الإيثين وسلاسله أطول؛ يُستخدم في الأكواب والأطباق والعبوات ومصدّات السيارات:</p>${EQ('nCH₂=CH(CH₃) → −(CH₂−CH(CH₃))ₙ−')}
<p><b>التفلون (متعدد رباعي فلورو إيثين):</b> من بلمرة CF₂=CF₂؛ لا يحترق ولا يتآكل ولا يتفاعل؛ يُستخدم في الأواني غير اللاصقة وملاعب التزلج والصمامات وعزل الأسلاك:</p>${EQ('nCF₂=CF₂ → −(CF₂−CF₂)ₙ−')}
<table><tr><th>المونومر</th><th>المبلمر</th><th>الاستخدام</th></tr><tr><td>كلوريد الفينيل CH₂=CHCl</td><td>متعدد كلوريد الفينيل PVC</td><td>الأنابيب البلاستيكية</td></tr><tr><td>بروبين نيتريل CH₂=CHCN</td><td>الإكريلان</td><td>الأقمشة</td></tr><tr><td>الستايرين CH₂=CH−C₆H₅</td><td>متعدد الستايرين</td><td>العزل الحراري</td></tr></table>
<h3>3) المبلمرات الطبيعية</h3>
<p>جزيئات ضخمة تتكون في أجسام الكائنات الحية، مثل البروتين والنشا والسليلوز والحرير والصوف.</p>
<p><b>البروتينات:</b> مبلمرات طبيعية من اتحاد <b>الحموض الأمينية</b> (صيغتها R−CH(NH₂)−COOH، تحتوي مجموعتي كربوكسيل وأمين)، ترتبط <b>بروابط ببتيدية (أميدية) −CO−NH−</b> تنشأ من تفاعل مجموعة الكربوكسيل لحمض مع مجموعة الأمين لآخر بحذف جزيء ماء. تعمل إنزيمات وهرمونات وتنقل الأكسجين. (أنزيم الليزوزيم كتلته 14600 g/mol يحلل خلايا البكتيريا).</p>
<p><b>النشا:</b> وحدته الجلوكوز C₆H₁₂O₆، ترتبط بروابط إيثرية (C−O−C) تسمى <b>روابط جاليكوسيدية</b>. يتكون من <b>الأميلوز</b> (سلاسل مستمرة، 10–20%) و<b>الأميلوبكتين</b> (سلاسل متفرعة، 80–90%).</p>
<p><b>السليلوز:</b> وحدته الجلوكوز بروابط جاليكوسيدية في سلاسل غير متفرعة؛ يدخل في جدران الخلايا النباتية، ويُستخدم في الورق والحرير الصناعي والألبسة القطنية.</p>
<h3>4) تكنولوجيا المبلمرات</h3>
<p>مجال يدرس خصائص المبلمرات وتركيبها وتطبيقاتها: مبلمرات موصلة كهربائيًا للإلكترونيات، دهانات مضادة للتآكل والبكتيريا، ومبلمرات قابلة للتحلل في الطب لإيصال الدواء، وخيوط جراحية وبراغي تقويم العظام. ويُشترط ألا يرفضها الجسم ولا تسبب التهابًا وأن تكون نواتج تحللها غير ضارة.</p>`,
 terms:[

UNIT_INTRO[3] = {general:'تتكون المركّبات الهيدروكربونية من عنصري الكربون والهيدروجين فقط، وتختلف أنواعها باختلاف طبيعة الروابط بين ذرات الكربون، وتتنوع خصائصها الكيميائية والفيزيائية، وتُسمّى حسب نظام IUPAC.',
 lessons:['الدرس الأول: المركّبات الهيدروكربونية المشبعة (الألكانات).','الدرس الثاني: المركّبات الهيدروكربونية غير المشبعة والمركّبات الأروماتية.'],
 exp:`<h3>🧪 التجربة الاستهلالية: بناء المركّبات الهيدروكربونية</h3>
<p><b>المواد:</b> مجموعة نماذج الذرات (كرات ووصلات).</p>
<ol><li>أختار 5 كرات بأربعة ثقوب (كربون) وأصلها في سلسلة، ثم أصلها بكرات الهيدروجين (ثقب واحد) وأكتب الصيغة.</li><li>أصمم نموذجًا بسلسلة من 4 ذرات كربون والخامسة متصلة بذرة في الوسط.</li><li>أصمم نموذجًا بسلسلة من 3 ذرات والذرتان الباقيتان متصلتان بالذرة الوسطى.</li></ol>
<div class="box key"><b>النتائج:</b> النماذج الثلاثة صيغتها الجزيئية <b>C₅H₁₂</b> (بنتان، 2-ميثيل بيوتان، 2،2-ثنائي ميثيل بروبان) ولها عدد ذرات الكربون نفسه.<br><b>العلاقة:</b> عدد ذرات الهيدروجين = 2 × عدد ذرات الكربون + 2 (CₙH₂ₙ₊₂).</div>`};
UNIT_INTRO[4] = {general:'تُصنّف مشتقات المركّبات الهيدروكربونية وفق المجموعات الوظيفية التي تحدد خصائصها الفيزيائية والكيميائية، وتُصنّف المبلمرات وفق طريقة تكوّنها، ولكل منها خصائصه واستخداماته.',
 lessons:['الدرس الأول: هاليدات الألكيل، الكحولات، الإيثرات والأمينات.','الدرس الثاني: مركّبات الكربونيل والحموض الكربوكسيلية ومشتقاتها.','الدرس الثالث: المبلمرات.'],
 exp:`<h3>🧪 التجربة الاستهلالية: التصاوغ الوظيفي</h3>
<p><b>المواد:</b> نماذج ذرات: 4 كرات كربون، كرة أكسجين (ثقبان)، 10 كرات هيدروجين.</p>
<p>أصل الكرات بطرائق مختلفة للحصول على أكبر عدد من متصاوغات C₄H₁₀O.</p>
<div class="box key"><b>النتائج:</b> 7 متصاوغات:<br><b>كحولات (O مرتبطة بـ C و H):</b> 1-بيوتانول، 2-بيوتانول، 2-ميثيل-1-بروبانول، 2-ميثيل-2-بروبانول.<br><b>إيثرات (O بين ذرتي كربون):</b> ثنائي إيثيل إيثر، ميثيل بروبيل إيثر، ميثيل آيزوبروبيل إيثر.<br>المتصاوغات من النوع نفسه (الكحولات معًا أو الإيثرات معًا) متشابهة في خصائصها الكيميائية لأن لها المجموعة الوظيفية نفسها.</div>`};

LESSON_EXTRA.u3l1 = `<h3>🧪 التجربة 1: تحضير غاز الميثان في المختبر</h3>
<p><b>المواد:</b> إيثانوات الصوديوم اللامائية CH₃COONa، هيدروكسيد الصوديوم الصلب NaOH، أكسيد الكالسيوم CaO، أنبوب اختبار وسدادة وأنبوب زجاجي، لهب بنسن، كأس طويلة مملوءة بالماء.</p>
<p><b>السلامة:</b> الحذر لأن الميثان سريع الاشتعال.</p>
<ol><li>أزن 10 g من كل من إيثانوات الصوديوم و NaOH و CaO وأضعها في الأنبوب.</li><li>أركب الجهاز بحيث يكون طرف الأنبوب الزجاجي تحت الكأس المقلوبة المملوءة بالماء.</li><li>أسخن الخليط مع تحريك اللهب وألاحظ الفقاعات وتغير مستوى الماء.</li></ol>
<div class="box key"><b>التحليل:</b> ينخفض مستوى الماء في الكأس لأن الغاز الناتج يحل محل الماء (جمع الغاز بإزاحة الماء لأنه لا يذوب فيه). الغاز الناتج <b>الميثان</b>:<div class="eq">CH₃COONa + NaOH →(CaO، حرارة) CH₄ + Na₂CO₃</div></div>
<h3>🌍 الربط</h3><ul><li><b>بعلوم الأرض:</b> يُستخرج الغاز الطبيعي في الأردن من حقل الريشة، والميثان مكوّنه الرئيس.</li><li><b>بتاريخ العلم:</b> تأسس الاتحاد الدولي للكيمياء البحتة والتطبيقية IUPAC عام 1919م، وهو السلطة العالمية للتسميات الكيميائية.</li><li><b>بالحياة:</b> الألكانات ذات 17 ذرة كربون فأكثر مواد تشحيم ومضادات للتآكل، وذات 20–40 ذرة في شمع البرافين.</li><li><b>بالصناعة:</b> يُنتج الكربون الأسود بتسخين الميثان إلى 1000°C بغياب الهواء، ويُستخدم في إطارات السيارات والطلاء الأسود وحبر الطباعة.</li></ul>
<h3>🔎 أبحث: أوكتان 90 وأوكتان 95 <span class="note">(إثراء)</span></h3><p>الرقم الأوكتاني مقياس لمقاومة الوقود للاحتراق المبكر (الطرق) في المحرك؛ يقارن أداء الوقود بخليط من الأيزوأوكتان (2،2،4-ثلاثي ميثيل بنتان، رقمه 100) والهبتان العادي (رقمه 0). فوقود أوكتان 95 يسلك كخليط فيه 95% أيزوأوكتان، ومقاومته للطرق أعلى من أوكتان 90.</p>`;
LESSON_EXTRA.u3l2 = `<h3>🧪 التجربة 2: أكسدة الألكينات باستخدام بيرمنغنات البوتاسيوم</h3>
<p><b>المواد:</b> هكسان، 2-هكسين، أنبوبا اختبار، ماصة، قطارة، محلول KMnO₄ (0.5%)، محلول KOH (0.1 M).</p>
<ol><li>أضع 1 mL ماء مقطر في الأنبوب (1) وأضيف 5–7 قطرات من الهكسان.</li><li>أضيف 5 قطرات من KMnO₄ و KOH وأرج مدة دقيقة وأسجل.</li><li>أكرر مع 2-هكسين في الأنبوب (2).</li></ol>
<div class="box key"><b>النتائج:</b> يتكون الراسب البني المحمر في <b>الأنبوب (2)</b> (2-هكسين) ويختفي اللون البنفسجي؛ لأن الألكين يتأكسد بكسر الرابطة الثنائية ويتكون MnO₂ البني المحمر. أما الهكسان فلا يتفاعل ويبقى اللون البنفسجي.</div>
<h3>🌍 الربط</h3><ul><li><b>بالصناعة:</b> يُستخدم البنزين مذيبًا لتنظيف قطع آلات الطباعة، ويدخل في صناعة الحبر والدهانات لأنه يبقيها سائلة.</li><li><b>بالصحة:</b> التعرض المستمر للمركّبات الأروماتية يؤثر في الجهاز التنفسي والكبد والجهاز العصبي وقد يسبب السرطان.</li><li><b>بالحياة:</b> الفانيلين C₈H₈O₃ مسؤول عن رائحة الفانيليا.</li></ul>
<h3>🌱 الإثراء والتوسع: هرمون الإيثين</h3><p>هرمون نباتي طبيعي غازي (الإيثيلين) يُصنَّع في الثمار وله دور في نضجها، ويُستخدم لإنضاج الموز والمانجا والبندورة في غرف التخزين. يسبب تلف الفواكه عند زيادته؛ لذا يُعزل التفاح (يطلق إيثينًا أكثر) عن الفواكه الأخرى بمسافة نصف متر على الأقل.</p>`;
LESSON_EXTRA.u4l1 = `<h3>🌍 الربط</h3><ul><li><b>بالبيئة:</b> مركّبات CFCs أضرت بطبقة الأوزون، وحلّت محلها HFCs مثل CF₃CH₂F، وأظهرت صور ناسا تحسنًا في ثقب الأوزون.</li><li><b>بالحياة:</b> جلايكول الإيثلين مضاد للتجمد يُرش على الطائرات ويوضع في مشع السيارة. الجليسرول يدخل في المرطبات لامتصاصه الماء.</li><li><b>بالطب:</b> ثنائي إيثيل إيثر من أوائل المخدرات العامة، وحلّ محله ميثيل بروبيل إيثر لآثاره الجانبية وقابليته للاشتعال.</li><li><b>بالحياة:</b> الشوكولاتة تحتوي أمينًا هو 2-فينيل-1-أمينو إيثان يُفترض أنه مسؤول عن الرغبة في تناولها.</li></ul>
<h3>🔎 أبحث: تسمية الأمينات الثانوية والثالثية <span class="note">(إثراء)</span></h3><p>تُسمّى حسب IUPAC باختيار أطول مجموعة ألكيل سلسلةً رئيسة، وتُعامل المجموعات الأخرى المرتبطة بالنيتروجين كتفرعات يُسبق اسمها بالحرف N، مثل CH₃NHCH₂CH₃: N-ميثيل إيثان أمين، و (CH₃)₂NCH₂CH₃: N،N-ثنائي ميثيل إيثان أمين.</p>`;
LESSON_EXTRA.u4l2 = `<h3>🧪 التجربة 1: اختبار ذوبان بعض المركّبات العضوية في الماء</h3>
<p><b>المواد:</b> إيثانول، ثنائي إيثيل إيثر، 1-هكسانول، هبتان، حمض الإيثانويك، بروميد الإيثيل، ماء مقطر، 7 أنابيب اختبار، قطارة.</p>
<ol><li>أضع 1 mL ماء في الأنبوب وأضيف 1 mL من المركّب قطرة قطرة مع التحريك.</li><li>ألاحظ: هل يمتزج أم تتكون طبقتان؟</li><li>أسجل: يمتزج كليًا، جزئيًا، لا يمتزج. وأكرر مع بقية المركّبات.</li></ol>
<table><tr><th>المركّب</th><th>قوى التجاذب</th><th>الذوبان في الماء</th></tr><tr><td>الإيثانول</td><td>روابط هيدروجينية</td><td>يمتزج كليًا</td></tr><tr><td>حمض الإيثانويك</td><td>روابط هيدروجينية</td><td>يمتزج كليًا</td></tr><tr><td>ثنائي إيثيل إيثر</td><td>ثنائية القطب</td><td>جزئيًا</td></tr><tr><td>1-هكسانول</td><td>روابط هيدروجينية (سلسلة طويلة)</td><td>جزئيًا/قليلًا جدًا</td></tr><tr><td>بروميد الإيثيل</td><td>ثنائية القطب</td><td>لا يمتزج تقريبًا</td></tr><tr><td>الهبتان</td><td>لندن</td><td>لا يمتزج</td></tr></table>
<div class="box key"><b>الاستنتاج:</b> المركّبات التي تكوّن روابط هيدروجينية مع الماء وسلاسلها قصيرة تذوب أكثر. يذوب الإيثانول تمامًا ولا يذوب 1-هكسانول لأن سلسلته الطويلة غير القطبية تقلل الذائبية.<br><b>المتغيرات:</b> (أ) الإيثانول و 1-هكسانول: المستقل طول السلسلة، التابع الذائبية، المضبوط نوع المجموعة الوظيفية. (ب) الهبتان و 1-هكسانول وبرومو إيثان: المستقل نوع قوى التجاذب، التابع الذائبية، المضبوط الكتلة المولية المتقاربة.</div>
<h3>🌍 الربط بالعلوم الحياتية</h3><p>لسعة النملة تسبب ألمًا بسبب حمض الميثانويك (النمليك/الفورميك)، ويُعالج بمحلول قاعدي من كربونات الصوديوم الهيدروجينية.</p>`;
LESSON_EXTRA.u4l3 = `<h3>🧪 التجربة 2: بناء نموذج لمبلمر متعدد الإيثين</h3>
<p><b>المواد:</b> مجموعة نماذج الذرات.</p>
<ol><li>أصمم 3 نماذج لجزيء الإيثين C₂H₄.</li><li>أفك الرابطة الثنائية في كل نموذج، وأربط ذرة كربون من كل نموذج بذرة كربون من نموذج آخر.</li><li>ألاحظ تكون سلسلة من 6 ذرات كربون تمثل جزءًا من متعدد الإيثين.</li></ol>
<div class="box key"><b>التحليل:</b> لم يكتمل عدد الروابط حول ذرتي الكربون في طرفي السلسلة (لكل منهما 3 روابط فقط)؛ لذا <b>يمكن إضافة جزيئات إيثين جديدة</b> إلى طرفي السلسلة واستمرار البلمرة.</div>
<h3>🌍 الربط</h3><ul><li><b>بالصناعة:</b> متعدد البروبين حبيبات بيضاء تُشكَّل بالضغط والحرارة.</li><li><b>بالعلوم الحياتية:</b> أنزيم الليزوزيم بروتين صغير نسبيًا (14600 g/mol) في الدموع والعرق وبياض البيض، يحلل خلايا البكتيريا.</li></ul>
<h3>🔎 أبحث: المشكلات البيئية للاستخدام الكثيف للبلاستيك <span class="note">(إثراء)</span></h3><p>تراكم البلاستيك في اليابسة والبحار لمقاومته للتحلل، اختناق الكائنات البحرية، تكوّن جسيمات البلاستيك الدقيقة في الماء والغذاء، وانبعاث غازات سامة عند حرقه.</p>
<h3>♻️ الإثراء والتوسع: البلاستيك القابل للتحلل</h3><ol><li><b>المليء بالنشا:</b> فيه حبيبات نشا تتغذى عليها البكتيريا فيتفتت.</li><li><b>الحراري البكتيري PHB:</b> تصنعه البكتيريا من السكريات، ويتحلل خلال نحو 9 أشهر.</li><li><b>القابل للتحلل الضوئي:</b> سلاسله فيها مجموعات C=O تمتص الأشعة فوق البنفسجية فتنكسر الروابط.</li><li><b>القابل للذوبان في الماء:</b> بولي إيثينول، تُصنع منه أكياس غسيل المستشفيات.</li></ol>`;

 {u:3, t:'التجربة 1: تحضير غاز الميثان', p:[7,8], a:`<b>الملاحظات:</b> تظهر فقاعات غازية في الكأس، وينخفض مستوى الماء داخلها تدريجيًا.<br><b>1)</b> ينخفض مستوى الماء لأن الغاز الناتج يتجمع أعلى الكأس فيزيح الماء (لا يذوب الميثان في الماء).<br><b>2)</b> الغاز الناتج <b>الميثان</b>: <div class="eq">CH₃COONa(s) + NaOH(s) →(CaO، حرارة) CH₄(g) + Na₂CO₃(s)</div>`},
 {u:3, t:'التجربة 2: أكسدة الألكينات بالبيرمنغنات', p:[9,9], a:`<b>الملاحظات:</b> الأنبوب (1) الهكسان: يبقى اللون البنفسجي. الأنبوب (2) 2-هكسين: يختفي اللون البنفسجي ويتكون راسب بني محمر.<br><b>1)</b> الأنبوب <b>(2)</b>.<br><b>2)</b> يتأكسد الألكين بكسر الرابطة الثنائية وتتكوّن مجموعتا OH، فيُستهلك KMnO₄ البنفسجي ويتحول إلى MnO₂ البني المحمر.`},
 {u:3, t:'التجربة الإثرائية: تحضير الإيثاين', p:[10,11], a:`<b>الملاحظات:</b> تتكون فقاعات تحتوي غاز الإيثاين، وعند تقريب عود الشواء المشتعل تشتعل الفقاعات بفرقعة ولهب.<br><b>1)</b> <b>زاد الاشتعال</b> (اشتعلت الفقاعات) لأن الإيثاين غاز قابل للاشتعال.<br><b>2)</b> <div class="eq">CaC₂ + 2H₂O → Ca(OH)₂ + C₂H₂</div><b>3)</b> <b>الماء أعلى كثافة</b>؛ لأن فقاعات الإيثاين تصعد وتطفو على سطح الماء ثم ترتفع في الهواء.`},
 {u:3, t:'أسئلة تفكير - الوحدة 3', p:[12,13], a:`<b>1)</b> (أ) 2-إيثيل-2-بيوتين خطأ (السلسلة ليست الأطول) ← <b>3-ميثيل-2-بنتين</b>. (ب) 2-ميثيل-4-بنتين خطأ (الترقيم من الطرف الأبعد عن الرابطة) ← <b>4-ميثيل-1-بنتين</b>.<br>
