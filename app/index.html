<b>8)</b> لأن فوهلر حضّر مركبًا عضويًا (اليوريا) من مركب غير عضوي (سيانات الأمونيوم) دون كائن حي.<br>
<b>9)</b> في صيغة كيكوله للبنزين: 3 روابط π، و σ = 6 (C−C) + 6 (C−H) = 12 ← النسبة π : σ = 3 : 12 = <b>1 : 4</b>.`},
 {u:4, t:'التجربة الاستهلالية: التصاوغ الوظيفي', p:[14,15], a:`<b>1)</b> <b>7</b> متصاوغات للصيغة C₄H₁₀O.<br><b>2)</b> <b>كحولات</b> (O مرتبطة بذرة C وذرة H): 1-بيوتانول، 2-بيوتانول، 2-ميثيل-1-بروبانول، 2-ميثيل-2-بروبانول. <b>إيثرات</b> (O بين ذرتي كربون): ثنائي إيثيل إيثر، ميثيل بروبيل إيثر، ميثيل آيزوبروبيل إيثر.<br><b>3)</b> الكحولات متشابهة فيما بينها، والإيثرات متشابهة فيما بينها، لأن لها المجموعة الوظيفية نفسها.`},
 {u:4, t:'التجربة 1: ذوبان المركّبات العضوية في الماء', p:[16,18], a:`<table><tr><th>المركّب</th><th>الحالة</th><th>صفة الذوبان</th><th>قوى التجاذب</th></tr><tr><td>إيثانول</td><td>يمتزج كليًا</td><td>ذائب</td><td>هيدروجينية</td></tr><tr><td>ثنائي إيثيل إيثر</td><td>جزئيًا</td><td>ذائب جزئيًا</td><td>ثنائية القطب</td></tr><tr><td>1-هكسانول</td><td>جزئيًا (قليل)</td><td>ذائب جزئيًا</td><td>هيدروجينية ولندن (سلسلة طويلة)</td></tr><tr><td>هبتان</td><td>لا يمتزج</td><td>لا يذوب</td><td>لندن</td></tr><tr><td>حمض الإيثانويك</td><td>يمتزج كليًا</td><td>ذائب</td><td>هيدروجينية</td></tr><tr><td>بروميد الإيثيل</td><td>لا يمتزج</td><td>لا يذوب</td><td>ثنائية القطب</td></tr></table>
<b>3)</b> المركّبات التي تكوّن روابط هيدروجينية مع الماء وسلاسلها قصيرة تذوب أكثر، وغير القطبية لا تذوب.<br><b>4)</b> سلسلة 1-هكسانول غير القطبية الطويلة تقلل الذائبية رغم وجود OH، أما سلسلة الإيثانول فقصيرة.<br><b>5)</b> (أ) المستقل: طول السلسلة الكربونية، التابع: الذائبية، المضبوط: نوع المجموعة الوظيفية (OH). (ب) المستقل: نوع قوى التجاذب (المجموعة الوظيفية)، التابع: الذائبية، المضبوط: الكتلة المولية المتقاربة.`},
 {u:4, t:'التجربة 2: نموذج لمبلمر متعدد الإيثين', p:[19,20], a:`<b>1)</b> <b>لا</b>؛ لكل من ذرتي الطرفين 3 روابط فقط.<br><b>2)</b> <b>نعم</b>؛ لأن ذرتي الطرفين تستطيعان تكوين رابطة إضافية مع جزيئات إيثين جديدة بعد كسر رابطتها π، فتستمر البلمرة بالإضافة.`},
 {u:4, t:'التجربة الإثرائية: قياس درجة غليان مركّبات عضوية', p:[21,22], a:`<table><tr><th>المادة</th><th>الصيغة</th><th>درجة الغليان العادية</th></tr><tr><td>الإيثانول</td><td>CH₃CH₂OH</td><td>78°C</td></tr><tr><td>الأسيتون</td><td>CH₃COCH₃</td><td>56°C</td></tr></table>
<b>1)</b> قطع البورسلان تمنع الغليان المفاجئ (الفوران) وتجعل الغليان منتظمًا.<br><b>2)</b> قد تختلف القراءة قليلًا عن القيمة العادية بسبب اختلاف الضغط الجوي (يقل في المرتفعات) أو عدم نقاء المادة أو موقع ميزان الحرارة ودقته.<br><b>3)</b> <b>الإيثانول</b> أعلى غليانًا؛ لأن جزيئاته ترتبط بروابط هيدروجينية، أما الأسيتون فبقوى ثنائية القطب.`},
 {u:4, t:'أسئلة تفكير - الوحدة 4', p:[23,24], a:`<b>السؤال الأول:</b> 1) مثال: <b>1-بروبانول</b> CH₃CH₂CH₂OH (Mr = 60، غليانه ≈ 97°C) و<b>1-كلوروإيثان</b> CH₃CH₂Cl (Mr = 64.5، غليانه ≈ 12°C). (جـ) الكحول أعلى غليانًا لأن جزيئاته ترتبط بروابط هيدروجينية، والكلوروألكان بقوى ثنائية القطب.<br>2) بزيادة طول السلسلة تزداد قوى لندن بين الأجزاء الألكيلية وتصبح هي المؤثر الأكبر، فيقل أثر الفرق بين المجموعتين الوظيفيتين.<br>
<b>السؤال الثاني:</b> لأن الأسبرين يحتوي مجموعة كربوكسيل (حمض كربوكسيلي) فيزيد حموضة المعدة ويهيّج القرحة.<br>
<b>السؤال الثالث:</b> جلايكول الإيثلين يحتوي مجموعتي OH فيكوّن كل جزيء روابط هيدروجينية أكثر مع الجزيئات المجاورة (شبكة)، أما حمض الإيثانويك فيكوّن ثنائيات (dimers) تترابط بقوى لندن.<br>
<b>السؤال الرابع:</b> المجموعة طرفية ويحوّل ورقة تباع الشمس الزرقاء إلى حمراء ← <b>حمض كربوكسيلي</b> C₄H₉COOH:<br>حمض البنتانويك CH₃CH₂CH₂CH₂COOH<br>حمض 2-ميثيل بيوتانويك CH₃CH₂CH(CH₃)COOH<br>حمض 3-ميثيل بيوتانويك (CH₃)₂CHCH₂COOH<br>حمض 2،2-ثنائي ميثيل بروبانويك (CH₃)₃CCOOH`}]
};

</script>
<script>
/* ================== تطبيق الكيمياء - الصف الحادي عشر - Dahshan Soft ================== */
const BOOK_URL = 'https://minhaji.net/download_files/103267';
const WA_NUM = '962779221235';
const IG_URL = 'https://instagram.com/dahshansoft';
const TRIAL_DAYS = 10;

const LS = {
  get(k, d){ try{ const v = localStorage.getItem('c11v2_'+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('c11v2_'+k, JSON.stringify(v)); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2400); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(x, d=3){ if(!isFinite(x)) return '—'; const a=Math.abs(x); if(a!==0 && (a<0.001 || a>=1e6)) return x.toExponential(3); return String(+x.toFixed(d)); }
const SUB = s => String(s).replace(/\d/g, d=>'₀₁₂₃₄₅₆₇₈₉'[d]);
if(LS.get('dark', false)) document.body.classList.add('dark');
const studentName = () => LS.get('name', '');

/* ================== الترخيص: تجربة 10 أيام وتفعيل برقمين ================== */
function fnv(s, seed){ let h = seed>>>0; for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619)>>>0; } return h>>>0; }
const __k=(()=>{const z=[73, 117, 115, 81, 65, 81, 89, 109, 42, 42, 39, 121, 34, 0, 10, 27, 76, 181, 168, 160, 221, 201, 192, 199, 193, 207, 131, 248, 225, 234, 233];const S=z.map((c,i)=>String.fromCharCode(c^((i*7+13)&255))).join('');return d=>String(10+(fnv(String(d).toUpperCase().trim()+'|'+S,2166136261)%90));})();
function devId(){
  let d = LS.get('dev', '');
  if(!d){ const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for(let i=0;i<6;i++) d += al[Math.floor(Math.random()*al.length)]; LS.set('dev', d); }
  return d;
}
function license(){
  const now = Date.now();
  let first = LS.get('first', 0); if(!first){ first = now; LS.set('first', first); }
  const last = LS.get('last', 0);
  let tamper = LS.get('tamper', false);
  if(last && now < last - 864e5){ tamper = true; LS.set('tamper', true); }
  if(now > last) LS.set('last', now);
  const activated = LS.get('key', '') === __k(devId());
  const used = (Math.max(now, last) - first) / 864e5;
  const left = Math.max(0, Math.ceil(TRIAL_DAYS - used));
  return { activated, left, expired: !activated && (left <= 0 || tamper) };
}
function tryActivate(code){
  const until = LS.get('lockUntil', 0);
  if(Date.now() < until){ toast('⏳ حاول مرة أخرى بعد '+Math.ceil((until-Date.now())/60000)+' دقيقة'); return false; }
  code = String(code||'').replace(/[^0-9٠-٩]/g,'').replace(/[٠-٩]/g, d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  if(code.length===2 && code === __k(devId())){ LS.set('key', code); LS.set('tamper', false); LS.set('fails', 0); toast('✅ تم تفعيل التطبيق بنجاح'); return true; }
  const f = LS.get('fails', 0) + 1; LS.set('fails', f);
  if(f % 3 === 0){ const mins = 30 * Math.pow(2, f/3 - 1); LS.set('lockUntil', Date.now() + mins*60000); toast('❌ محاولات كثيرة خاطئة. انتظر '+mins+' دقيقة'); }
  else toast('❌ كود التفعيل غير صحيح');
  return false;
}
function waLink(msg){ return 'https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(msg); }
function actMsg(){ return 'مرحبًا، أريد تفعيل تطبيق الكيمياء للصف الحادي عشر.\nاسم الطالب: '+studentName()+'\nرقم الجهاز: '+devId(); }
function openExt(url){ let w=null; try{ w = window.open(url, '_blank'); }catch(e){} if(!w) location.href = url; }
function openBookOnline(){ openExt(BOOK_URL); }

/* ================== التقدّم ================== */
function prog(){ return LS.get('prog', {}); }
function setBest(id, p){ const g=prog(); if(!g[id] || p>g[id]) { g[id]=p; LS.set('prog', g); } }
function markRead(id){ const r=LS.get('read',{}); if(!r[id]){ r[id]=1; LS.set('read', r); } }
function lessonPct(id){ const r=LS.get('read',{}); return Math.round((r[id]?20:0) + (prog()[id]||0)*0.8); }
function semPct(sem){ const ls=LESSONS.filter(l=>l.sem===sem); return Math.round(ls.reduce((s,l)=>s+lessonPct(l.id),0)/ls.length); }

/* ================== التنقل ================== */
let stack = [{v:'home'}];
let armed = false;
function cur(){ return stack[stack.length-1]; }
function semOf(){ for(let i=stack.length-1;i>=0;i--) if(stack[i].sem) return stack[i].sem; return 1; }
function arm(){ if(!armed){ try{ history.pushState({g:1}, ''); armed = true; }catch(e){} } }
function go(s){ if(!s.sem) s.sem = semOf(); stack.push(s); arm(); render(); window.scrollTo(0,0); }
function back(){ if(stack.length>1){ stack.pop(); render(); window.scrollTo(0,0); } }
function tabGo(v){ const sem = semOf(); stack=[{v:'home'}]; if(v==='semHome'){ stack.push({v:'sem', sem}); } else if(v!=='home'){ stack.push({v:'sem', sem}); stack.push({v, sem}); } if(stack.length>1) arm(); render(); window.scrollTo(0,0); }
window.addEventListener('popstate', () => {
  armed = false;
  const m = document.querySelector('.modal'); if(m){ m.remove(); arm(); return; }
  if(stack.length>1){ back(); arm(); }
});
try{ history.replaceState({g:0}, ''); }catch(e){}

let timerH = null;
function render(){
  clearInterval(timerH);
  const app = $('#app');
  if(!studentName()){ app.innerHTML = nameView(); document.querySelector('.nav')?.remove(); setTimeout(()=>$('#nm')?.focus(),100); return; }
  const L = license();
  const s = cur();
  if(L.expired && s.v!=='book'){ stack=[{v:'home'}]; app.innerHTML = lockView(); document.querySelector('.nav')?.remove(); return; }
  const views = {home:homeView, sem:semView, unit:unitView, lesson:lessonView, tools:toolsView, tool:toolView, pt:ptView, flash:flashView, exam:examView, formulas:formulasView, about:aboutView, book:bookView, books:booksView, act:actView};
  const sn = s.sem===2 ? 'الفصل الثاني' : 'الفصل الأول';
  const titles = {home:'الكيمياء - الحادي عشر', sem:'الكيمياء · '+sn, unit:'الوحدة: المقدمة والمراجعة', tools:'الأدوات · '+sn, pt:'الجدول الدوري', flash:'البطاقات · '+sn, exam:'الاختبار الشامل · '+sn, formulas:'ملخص القوانين · '+sn, about:'حول التطبيق', book:'الكتاب', books:'الكتب المدرسية · '+sn, act:'حلول كتاب الأنشطة · '+sn};
  let title = titles[s.v] || '';
  if(s.v==='lesson') title = LESSONS.find(l=>l.id===s.id).title;
  if(s.v==='tool') title = ALLTOOLS.find(t=>t.id===s.id).t;
  if(s.v==='book') title = BOOKS_META[s.b].t;
  app.innerHTML = `<div class="top">${stack.length>1?'<button class="ib" onclick="back()" aria-label="رجوع">➜</button>':'<span style="font-size:26px">⚗️</span>'}<h1>${esc(title)}</h1><button class="ib" onclick="toggleDark()" title="الوضع الليلي">🌓</button></div><div class="wrap" id="main"></div>`;
  views[s.v](document.getElementById('main'), s, L);
  if(L.expired){ document.querySelector('.nav')?.remove(); return; }
  navBar();
}
function navBar(){
  let n = document.querySelector('.nav');
  if(stack.length===1 && cur().v==='home'){ n?.remove(); return; }
  if(!n){ n=document.createElement('div'); n.className='nav'; document.body.appendChild(n); }
  const v = cur().v;
  const on = k => (k==='semHome' && ['sem','lesson','unit','flash','formulas','book','books','act'].includes(v)) || k===v || (k==='tools' && v==='tool');
  const items=[['home','🏠','الرئيسية'],['semHome','📚','الدروس'],['tools','🧮','الأدوات'],['exam','📝','الاختبار'],['about','☰','المزيد']];
  n.innerHTML = items.map(([k,i,t])=>`<button class="${on(k)?'on':''}" onclick="tabGo('${k}')"><span>${i}</span>${t}</button>`).join('');
}
function toggleDark(){ document.body.classList.toggle('dark'); LS.set('dark', document.body.classList.contains('dark')); }

/* ================== شاشة الاسم ================== */
function nameView(){
  return `<div class="lock"><div class="card">
  <div style="font-size:56px">⚗️</div>
  <h2 style="margin:4px 0">أهلًا بك في تطبيق الكيمياء</h2>
  <p style="color:var(--mut);margin:4px 0 14px">الصف الحادي عشر · المسار الأكاديمي · الفصلان الأول والثاني</p>
  <div class="fld"><label style="text-align:right">اكتب اسمك للدخول</label><input id="nm" maxlength="40" placeholder="اسم الطالب" style="direction:rtl;text-align:right;font-size:18px" onkeydown="if(event.key==='Enter') saveName()"></div>
  <button class="btn full" onclick="saveName()">دخول</button>
  <p class="note" style="margin-top:12px">🎁 تجربة مجانية كاملة لمدة ${TRIAL_DAYS} أيام</p>
  <p class="credit">تطوير: <b>Dahshan Soft</b></p></div></div>`;
}
function saveName(){ const v=($('#nm').value||'').trim().replace(/\s+/g,' '); if(v.length<2){ toast('اكتب اسمك من فضلك'); return; } LS.set('name', v); license(); stack=[{v:'home'}]; render(); }

/* ================== شاشة القفل ================== */
function lockView(){
  const d = devId();
  return `<div class="lock"><div class="card">
  <div style="font-size:54px">🔒</div>
  <h2 style="margin:4px 0">انتهت الفترة التجريبية</h2>
  <p style="color:var(--mut)">عزيزي ${esc(studentName())}، انتهت مدة التجربة المجانية (${TRIAL_DAYS} أيام). لمتابعة الاستفادة من الدروس والاختبارات والأدوات، اطلب كود التفعيل.</p>
  <div style="font-size:14px;color:var(--mut)">رقم جهازك:</div>
  <div class="code">${d}</div>
  <button class="btn wa full" onclick="openExt(waLink(actMsg()))">💬 اطلب كود التفعيل عبر واتساب</button>
  <div class="fld" style="margin-top:14px"><input id="actc" maxlength="2" inputmode="numeric" placeholder="_ _" style="text-align:center;letter-spacing:10px;font-size:28px;font-weight:800"></div>
  <button class="btn full" id="actb" onclick="if(tryActivate($('#actc').value)) render()">تفعيل</button>
  <div class="row" style="margin-top:10px"><button class="btn sec2" style="flex:1" onclick="go({v:'book',b:'s1',p:1,z:1,sem:1})">📖 كتاب الفصل الأول</button><button class="btn sec2" style="flex:1" onclick="go({v:'book',b:'s2',p:1,z:1,sem:2})">📖 كتاب الفصل الثاني</button></div>
  <p class="credit">تطوير: <b>Dahshan Soft</b></p></div></div>`;
}
function trialBox(L){
  return L.activated ? `<div class="trial ok">✅ <span>النسخة مفعّلة بالكامل — بالتوفيق يا ${esc(studentName())}</span></div>`
    : `<div class="trial">⏳ <span>النسخة التجريبية: متبقٍ <b>${L.left}</b> ${L.left>=3&&L.left<=10?'أيام':'يوم'} من ${TRIAL_DAYS}</span><button class="lnk" style="background:#8a6d33;margin-right:auto" onclick="tabGo('about')">تفعيل</button></div>`;
}

/* ================== الشاشة الأولى: اختيار الفصل ================== */
function homeView(el, s, L){
  el.innerHTML = `${trialBox(L)}
  <div class="hero"><div class="atom">⚛️</div><h2>مرحبًا يا ${esc(studentName())} 👋</h2><p>الكيمياء · الصف الحادي عشر · المسار الأكاديمي</p><small style="margin-top:10px">اختر الفصل الدراسي للبدء</small></div>
  <button class="sembtn" onclick="go({v:'sem',sem:1})"><span class="sn">1</span><span class="st"><b>الفصل الدراسي الأول</b><small>أشكال الجزيئات وقوى التجاذب · التفاعلات والحسابات الكيميائية</small><i style="--w:${semPct(1)}%"></i></span><span class="arr">←</span></button>
  <button class="sembtn s2" onclick="go({v:'sem',sem:2})"><span class="sn">2</span><span class="st"><b>الفصل الدراسي الثاني</b><small>المركّبات الهيدروكربونية · مشتقات المركّبات الهيدروكربونية</small><i style="--w:${semPct(2)}%"></i></span><span class="arr">←</span></button>
  <div class="grid" style="margin-top:14px">
   ${tile('🧪','الجدول الدوري','تفاعلي بالأسماء العربية',"go({v:'pt'})")}
   ${tile('☰','حول التطبيق والتفعيل','الاسم، الاشتراك، الإعدادات',"go({v:'about'})")}
  </div>${credit()}`;
}

/* ================== شاشة الفصل ================== */
function semView(el, s, L){
  const sem = s.sem, p = semPct(sem);
  const sb = sem===1?'s1':'s2', ab = sem===1?'a1':'a2';
  let h = trialBox(L);
  h += `<div class="hero ${sem===2?'h2':''}"><div class="atom">${sem===1?'⚛️':'🧬'}</div><h2>الفصل الدراسي ${sem===1?'الأول':'الثاني'}</h2><p>${esc(studentName())} · الصف الحادي عشر</p>
  <div class="prog"><i style="width:${p}%"></i></div><small>إنجازك في هذا الفصل: ${p}%</small></div>
  <div class="row" style="margin-top:12px;gap:10px">
   <button class="bookbtn sm" style="flex:1;margin:0" onclick="go({v:'book',b:'${sb}',p:1,z:1})"><span class="i">📖</span><span style="flex:1;text-align:right">كتاب الطالب<small>${BOOKS_META[sb].n} صفحة</small></span></button>
   <button class="bookbtn sm" style="flex:1;margin:0" onclick="go({v:'book',b:'${ab}',p:1,z:1})"><span class="i">🧪</span><span style="flex:1;text-align:right">كتاب الأنشطة<small>${BOOKS_META[ab].n} صفحة</small></span></button></div>
  <div class="sec">📚 الوحدات والدروس</div>`;
  UNITS.filter(u=>u.sem===sem).forEach(u => {

/* ================== محرّك الاختبارات ================== */
function runQuiz(box, qs, opt){
  const Q = qs.map(q=>{ const idx=shuffle(q.o.map((_,i)=>i)); return {...q, o:idx.map(i=>q.o[i]), a:idx.indexOf(q.a)}; });
  const st = {i:0, score:0, ans:[]};
  const lab=['أ)','ب)','جـ)','د)','هـ)'];
  function show(){
    if(st.i>=Q.length) return finish();
    const q = Q[st.i];
    box.innerHTML = `<div class="card qz"><div class="row" style="justify-content:space-between"><b>${opt.title||'اختبار'}</b><span class="badge">${st.i+1} / ${Q.length}</span>${opt.time?'<span class="timer" id="tm"></span>':''}</div>
    <div class="bar"><i style="width:${st.i/Q.length*100}%"></i></div>
    <div class="qtxt">${q.q}</div>${q.o.map((o,k)=>`<button class="opt">${lab[k]} ${o}</button>`).join('')}<div id="ex"></div></div>`;
    box.querySelectorAll('.opt').forEach((b,k)=>{ b.onclick=()=>pick(k); });
    if(opt.time) tick();
  }
  function pick(k){
    const q=Q[st.i]; if(st.ans[st.i]!==undefined) return;
    st.ans[st.i]=k; const ok = k===q.a; if(ok) st.score++;
    const bs = box.querySelectorAll('.opt'); bs[q.a].classList.add('c'); if(!ok) bs[k].classList.add('w');
    if(opt.exam){ setTimeout(()=>{st.i++;show();}, 450); return; }
    $('#ex').innerHTML = `<div class="expl">${ok?'✅ <b>إجابة صحيحة!</b>':'❌ <b>إجابة خاطئة.</b>'} ${q.e||''}</div><button class="btn full" style="margin-top:10px" id="nx">${st.i+1<Q.length?'السؤال التالي ←':'عرض النتيجة'}</button>`;
    $('#nx').onclick=()=>{st.i++;show();window.scrollTo(0,0);};
  }
  function tick(){
    const upd=()=>{ const r=Math.max(0, Math.round((st.end-Date.now())/1000)); const t=$('#tm'); if(t) t.textContent=`⏱ ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`; if(r<=0){ clearInterval(timerH); st.i=Q.length; finish(true);} };
    if(!st.end) st.end = Date.now()+opt.time*1000;
    clearInterval(timerH); upd(); timerH=setInterval(upd,1000);
  }
  function finish(timeout){
    clearInterval(timerH);
    const pct = Math.round(st.score/Q.length*100);
    if(opt.onEnd) opt.onEnd(pct);
    const msg = pct>=90?'ممتاز يا '+esc(studentName())+'! أداء رائع 🌟':pct>=75?'جيد جدًا 👏':pct>=50?'جيد، راجع الأخطاء 💪':'تحتاج إلى مراجعة الدرس مرة أخرى 📘';
    let h = `<div class="card score">${timeout?'<div class="note">⏰ انتهى الوقت</div>':''}<div class="big">${pct}%</div><div>أجبت عن <b>${st.score}</b> من <b>${Q.length}</b> إجابة صحيحة</div><p>${msg}</p>
    <div class="row" style="justify-content:center"><button class="btn" id="again">🔁 إعادة الاختبار</button></div></div>`;
    const wrong = Q.map((q,i)=>({q,i})).filter(x=>st.ans[x.i]!==x.q.a);
    if(wrong.length){ h += `<div class="sec">📋 مراجعة الأخطاء</div>` + wrong.map(({q,i})=>`<div class="card"><b>${q.q}</b><div style="color:var(--bad);margin-top:6px">إجابتك: ${st.ans[i]===undefined?'لم تُجب':q.o[st.ans[i]]}</div><div style="color:var(--ok)">الصحيحة: ${q.o[q.a]}</div>${q.e?`<div class="expl">${q.e}</div>`:''}</div>`).join(''); }
    box.innerHTML = h;
    $('#again').onclick=()=>runQuiz(box, qs, opt);
  }
  show();
}

/* ================== الكتلة المولية ================== */
function massOf(sym, book){ if(book && BOOK_MASS[sym]!==undefined) return BOOK_MASS[sym]; const e=ELEMENTS.find(x=>x.sy===sym); return e?e.m:null; }
function parseFormula(f){
  f = String(f).replace(/\s+/g,'').replace(/[₀-₉]/g, c=>'0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(c)]);
  if(!f) throw 'أدخل صيغة';
  const total = {};
  f.split(/[·.*]/).forEach(part=>{
    let mult=1; const m=part.match(/^(\d+)(.*)$/); if(m){ mult=+m[1]; part=m[2]; }
    const stack=[{}]; let i=0;
    while(i<part.length){
      const ch=part[i];
      if(ch==='('||ch==='['){ stack.push({}); i++; }
      else if(ch===')'||ch===']'){ i++; let n=''; while(/\d/.test(part[i]||'')) n+=part[i++]; const g=stack.pop(); if(!stack.length) throw 'أقواس غير متوازنة'; const top=stack[stack.length-1]; for(const k in g) top[k]=(top[k]||0)+g[k]*(n?+n:1); }
      else if(/[A-Z]/.test(ch)){ let s=ch; i++; while(/[a-z]/.test(part[i]||'')) s+=part[i++]; let n=''; while(/\d/.test(part[i]||'')) n+=part[i++]; if(!ELEMENTS.find(e=>e.sy===s)) throw 'عنصر غير معروف: '+s; const top=stack[stack.length-1]; top[s]=(top[s]||0)+(n?+n:1); }
      else throw 'رمز غير صالح: '+ch;
    }
    if(stack.length!==1) throw 'أقواس غير متوازنة';
    for(const k in stack[0]) total[k]=(total[k]||0)+stack[0][k]*mult;
  });
  return total;
}
function molarMass(f, book=true){ const t=parseFormula(f); let s=0; for(const k in t) s+=massOf(k,book)*t[k]; return s; }
function mrVal(v){ v=String(v||'').trim(); if(!v) return NaN; if(/^[\d.]+$/.test(v)) return +v; try{ return molarMass(v, true); }catch(e){ return NaN; } }

function tConc(el, s){

  if(s.mode==='mp') f = fld('a','كتلة المذاب (g)')+fld('b','كتلة المذيب (g)')+fld('c','كتلة المحلول (g)')+fld('p','النسبة المئوية بالكتلة (%)');
  if(s.mode==='vp') f = fld('a','حجم المذاب (mL)')+fld('c','حجم المحلول (mL)')+fld('p','النسبة المئوية بالحجم (%)');
  if(s.mode==='M') f = fld('g','كتلة المذاب (g) — اختياري')+fld('mr','الكتلة المولية Mr أو الصيغة (مثل KOH)','text')+fld('n','عدد المولات (mol)')+fld('v','حجم المحلول (mL)')+fld('M','المولارية (M)');
  if(s.mode==='m') f = fld('g','كتلة المذاب (g) — اختياري')+fld('mr','الكتلة المولية Mr أو الصيغة','text')+fld('n','عدد المولات (mol)')+fld('w','كتلة المذيب (g)')+fld('mm','المولالية (mol/kg)');

  <div class="card"><p class="note">✏️ املأ المعطيات واترك المطلوب فارغًا ثم اضغط «احسب».</p>${f}<button class="btn full" onclick="calcConc()">احسب</button><div id="r"></div></div>`;
}
function calcConc(){
  const mode=cur().mode, r=$('#r'); let out='';
  try{
  if(mode==='X'){ let na=num('na'), nb=num('nb');
    if(isNaN(na)&&!isNaN(num('ga'))){ const m=mrVal($('#fa').value); na=num('ga')/m; out+=`n(المذيب) = ${num('ga')} ÷ ${fmt(m)} = ${fmt(na,4)} mol<br>`; }
    if(isNaN(nb)&&!isNaN(num('gb'))){ const m=mrVal($('#fb').value); nb=num('gb')/m; out+=`n(المذاب) = ${num('gb')} ÷ ${fmt(m)} = ${fmt(nb,4)} mol<br>`; }
    if(na>0&&nb>0){ const t=na+nb; out+=`n الكلي = ${fmt(t,4)} mol<br>X(المذيب) = ${fmt(na,4)} ÷ ${fmt(t,4)} = <b>${fmt(na/t,3)}</b> (${fmt(na/t*100,1)}%)<br>X(المذاب) = ${fmt(nb,4)} ÷ ${fmt(t,4)} = <b>${fmt(nb/t,3)}</b> (${fmt(nb/t*100,1)}%)`; } else out='';
  }
  if(mode==='mp'){ let a=num('a'),b=num('b'),c=num('c'),p=num('p');
    if(isNaN(c)&&!isNaN(a)&&!isNaN(b)){ c=a+b; out+=`كتلة المحلول = ${a} + ${b} = <b>${fmt(c)} g</b><br>`; }
    if(isNaN(p)&&!isNaN(a)&&!isNaN(c)){ p=a/c*100; out+=`m% = (${a} ÷ ${fmt(c)}) × 100% = <b>${fmt(p,2)}%</b>`; }
    else if(isNaN(a)&&!isNaN(p)&&!isNaN(c)){ a=p*c/100; out+=`كتلة المذاب = ${p}% × ${c} ÷ 100 = <b>${fmt(a)} g</b><br>كتلة المذيب = <b>${fmt(c-a)} g</b>`; }
    else if(isNaN(c)&&!isNaN(p)&&!isNaN(a)){ c=a*100/p; out+=`كتلة المحلول = ${a} × 100 ÷ ${p} = <b>${fmt(c)} g</b>`; }
  }
  if(mode==='vp'){ let a=num('a'),c=num('c'),p=num('p');
    if(isNaN(p)&&a>=0&&c>0) out=`V% = (${a} ÷ ${c}) × 100% = <b>${fmt(a/c*100,2)}%</b>`;
    else if(isNaN(a)&&p>0&&c>0) out=`حجم المذاب = ${p} × ${c} ÷ 100 = <b>${fmt(p*c/100)} mL</b>`;
    else if(isNaN(c)&&p>0&&a>0) out=`حجم المحلول = ${a} × 100 ÷ ${p} = <b>${fmt(a*100/p)} mL</b>`;
  }
  if(mode==='M'||mode==='m'){ const g=num('g'), mr=mrVal($('#mr').value); let n=num('n');
    const V = mode==='M'? num('v')/1000 : num('w')/1000; let C = mode==='M'? num('M') : num('mm');
    const unit = mode==='M'?'M':'mol/kg', vl = mode==='M'?'V (L)':'كتلة المذيب (kg)';
    if(isNaN(n)&&!isNaN(g)&&!isNaN(mr)){ n=g/mr; out+=`n = m ÷ Mr = ${g} ÷ ${fmt(mr)} = <b>${fmt(n,4)} mol</b><br>`; }
    if(isNaN(C)&&!isNaN(n)&&!isNaN(V)){ out+=`${mode==='M'?'M':'m'} = n ÷ ${vl} = ${fmt(n,4)} ÷ ${fmt(V,4)} = <b>${fmt(n/V,4)} ${unit}</b>`; }
    else if(isNaN(n)&&!isNaN(C)&&!isNaN(V)){ n=C*V; out+=`n = ${C} × ${fmt(V,4)} = <b>${fmt(n,4)} mol</b>`; if(!isNaN(mr)) out+=`<br>الكتلة = n × Mr = <b>${fmt(n*mr,3)} g</b>`; }
    else if(isNaN(V)&&!isNaN(C)&&!isNaN(n)){ const vv=n/C; out+=`${vl} = n ÷ ${C} = <b>${fmt(vv,4)}</b> ${mode==='M'?`= ${fmt(vv*1000,2)} mL`:`= ${fmt(vv*1000,2)} g`}`; }
  }
  }catch(e){}
  r.innerHTML = `<div class="res">${out||'⚠️ تحقق من المدخلات: اترك قيمة واحدة مطلوبة فارغة.'}</div>`;
}

function limMoles(p){
  const t=$('#'+p+'t').value, v=num(p+'v'), mr=mrVal($('#'+p+'f').value);
  if(t==='mol') return {n:v, mr, txt:`n = ${v} mol`};
  if(t==='sol'){ const V=num(p+'v2')/1000; return {n:v*V, mr, txt:`n = M × V = ${v} × ${fmt(V,4)} L = ${fmt(v*V,5)} mol`}; }
  return {n:v/mr, mr, txt:`n = m ÷ Mr = ${v} ÷ ${fmt(mr)} = ${fmt(v/mr,4)} mol`};
}
function calcLim(){
  const ac=num('Ac'), bc=num('Bc'), A=limMoles('A'), B=limMoles('B'), an=$('#Af').value, bn=$('#Bf').value;
  if(!(A.n>0&&B.n>0&&ac>0&&bc>0)){ $('#r').innerHTML='<div class="res">⚠️ تحقق من المدخلات.</div>'; return; }
  const needB = A.n*bc/ac; let o=`<b>1) تحويل الكميات إلى مولات:</b><br>${an}: ${A.txt}<br>${bn}: ${B.txt}<br><b>2) المولات المطلوبة من ${bn}:</b><br>= (${bc} ÷ ${ac}) × ${fmt(A.n,4)} = ${fmt(needB,4)} mol<br>`;
  let exc, limN, excN, limC, used;
  if(needB > B.n){ exc=an; limN=B.n; limC=bc; excN=A.n; used=B.n*ac/bc; o+=`المتوافر من ${bn} (${fmt(B.n,4)}) أقل من المطلوب ← <b>${bn} هي المادة المحددة</b> و ${an} فائضة.<br>`; }
  else { exc=bn; limN=A.n; limC=ac; excN=B.n; used=needB; o+=`المتوافر من ${bn} (${fmt(B.n,4)}) ${needB===B.n?'يساوي':'أكبر من'} المطلوب ← <b>${an} هي المادة المحددة</b>${needB===B.n?' (والمادتان تستهلكان كليًا)':` و ${bn} فائضة`}.<br>`; }
  const left = excN-used; const excMr = exc===an?A.mr:B.mr;
  o += `<b>3) الفائض:</b> المتفاعل من ${exc} = ${fmt(used,4)} mol ، المتبقي = <b>${fmt(left,4)} mol</b>${isFinite(excMr)?` = <b>${fmt(left*excMr,3)} g</b>`:''}<br>`;
  const pc=num('Pc'), pmr=mrVal($('#Pf').value), ay=num('Ay');
  if(pc>0){ const pn=limN*pc/limC; o+=`<b>4) الناتج ${esc($('#Pf').value)}:</b> n = (${pc} ÷ ${limC}) × ${fmt(limN,4)} = <b>${fmt(pn,4)} mol</b>${isFinite(pmr)?` ، المردود النظري = ${fmt(pn,4)} × ${fmt(pmr)} = <b>${fmt(pn*pmr,3)} g</b>`:''}`;
    if(isFinite(pmr) && ay>0) o+=`<br><b>5) المردود المئوي:</b> Y% = (${ay} ÷ ${fmt(pn*pmr,3)}) × 100% = <b>${fmt(ay/(pn*pmr)*100,1)}%</b>`; }
  $('#r').innerHTML = `<div class="res">${o}</div>`;
}

const PREF = ['ميث','إيث','بروب','بيوت','بنت','هكس','هبت','أوكت','نون','ديك'];
const KINDS = {
 alkane:{t:'ألكان',min:1}, alkene:{t:'ألكين',min:2,pos:true}, alkyne:{t:'ألكاين',min:2,pos:true},
 halide:{t:'هاليد ألكيل',min:1,pos:true,x:true}, alcohol:{t:'كحول',min:1,pos:true}, amine:{t:'أمين أولي',min:1,pos:true},

function posRange(k,n){ if(k==='alkene'||k==='alkyne') return [1, Math.floor(n/2)]; if(k==='ketone') return [2, Math.ceil(n/2)]; if(['halide','alcohol','amine'].includes(k)) return [1, Math.ceil(n/2)]; return [1,1]; }
function buildOrganic(k, n, p, X){
  const C = Array.from({length:n}, ()=>({h:4, sub:'', o:''})); const bond = Array(n).fill(1);
  for(let i=0;i<n-1;i++){ C[i].h--; C[i+1].h--; }
  if(k==='alkene'){ bond[p-1]=2; C[p-1].h--; C[p].h--; }
  if(k==='alkyne'){ bond[p-1]=3; C[p-1].h-=2; C[p].h-=2; }
  if(k==='halide'){ C[p-1].h--; C[p-1].sub=X; }
  if(k==='alcohol'){ C[p-1].h--; C[p-1].sub='OH'; }
  if(k==='amine'){ C[p-1].h--; C[p-1].sub='NH₂'; }
  if(k==='aldehyde'){ C[0].h-=2; C[0].o='CHO'; }
  if(k==='acid'){ C[0].h-=3; C[0].o='COOH'; }
  if(k==='ketone'){ C[p-1].h-=2; C[p-1].o='CO'; }
  // عرض: نجعل المجموعة الطرفية في نهاية السلسلة
  let order = C.map((_,i)=>i), bonds = bond.slice(0,n-1);
  if(p===1 || k==='aldehyde' || k==='acid'){ order.reverse(); bonds.reverse(); }
  let s=''; order.forEach((ci,idx)=>{ const c=C[ci]; let g;
    if(c.o==='CHO') g = n===1?'HCHO':'CHO'; else if(c.o==='COOH') g = n===1?'HCOOH':'COOH'; else if(c.o==='CO') g='CO';
    else { g = 'C' + (c.h>0?'H'+(c.h>1?SUB(c.h):''):''); if(c.sub) g += (idx===order.length-1 && n>1) ? c.sub : '('+c.sub+')'; if(n===1&&c.sub) g='CH₃'+c.sub; }
    if(idx===0 && g==='CH') g='HC';
    s += g; if(idx<order.length-1){ const b=bonds[idx]; s += b===2?'=':b===3?'≡':''; } });
  const H = {alkane:2*n+2, alkene:2*n, alkyne:2*n-2, halide:2*n+1, alcohol:2*n+2, amine:2*n+3, aldehyde:2*n, ketone:2*n, acid:2*n}[k];
  let mf = 'C'+(n>1?SUB(n):'')+'H'+SUB(H);
  if(k==='halide') mf+=X; if(k==='alcohol'||k==='aldehyde'||k==='ketone') mf+='O'; if(k==='acid') mf+='O₂'; if(k==='amine') mf+='N';
  const pr = PREF[n-1]; let name;
  if(k==='alkane') name = pr+'ان';

  if(k==='alkyne') name = (n>3?p+'-':'')+pr+'اين';
  if(k==='halide') name = (n>2?p+'-':'')+XN[X]+' '+pr+'ان';
  if(k==='alcohol') name = (n>2?p+'-':'')+pr+'انول';
  if(k==='amine') name = (n>2?p+'-':'')+'أمينو '+pr+'ان';
  if(k==='aldehyde') name = pr+'انال';
  if(k==='ketone') name = (n>4?p+'-':'')+pr+'انون';
  if(k==='acid') name = 'حمض ال'+pr+'انويك';
  return {s, mf, name};
}

  el.innerHTML = `<div class="card"><table><tr><th>المونومر</th><th>الصيغة</th><th>المبلمر</th><th>الاستخدام</th></tr>${P.map(x=>`<tr><td>${x[0]}</td><td dir="ltr">${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</table>
  <div class="eq">nCH₂=CHY → −(CH₂−CHY)ₙ−</div><p class="note">تنكسر الرابطة π في المونومر فترتبط الجزيئات في سلسلة طويلة (بلمرة بالإضافة) بوجود حرارة وضغط وعامل مساعد.</p></div>`;
}
